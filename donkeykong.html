<body>

<canvas id="game"></canvas>

<div id="hud">

<div id="phaseBanner"></div>

        <button class="btn" id="jump" type="button">▲</button>
    </div>
</div>

<div id="screen">
    <div class="screenInner">
        <div class="logo">PIPE BRAWL</div>
        <div class="subtitle">ARCADE 83</div>
        <div id="screenMessage">INSERT COIN</div>
        <button class="screenButton" id="startButton" type="button">
            JUGAR
        </button>
    </div>
</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {alpha:false});

let W = 390;
let H = 844;
let DPR = 1;

function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    generateLevel();
}

window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>{
    setTimeout(resize,100);
});


/* =========================================================
   STATE
========================================================= */

let state = "menu";

let score = 0;
let highScore = Number(localStorage.getItem("pipeBrawl83HighScore") || 0);
let lives = 3;
let phase = 1;

let shake = 0;
let time = 0;

let particles = [];
let enemies = [];

let spawnRemaining = 0;
let waveTarget = 0;
let waveKills = 0;
let spawnTimer = 0;

let phaseTransition = 0;

let platforms = [];
let pipes = [];
let pow = null;


/* =========================================================
   INPUT
========================================================= */

const input = {
    left:false,
    right:false,
    jump:false
};

function resetInput(){
    input.left = false;
    input.right = false;
    input.jump = false;

    document.querySelectorAll(".btn").forEach(b=>{
        b.classList.remove("active");
    });
}

window.addEventListener("blur",resetInput);

document.addEventListener("visibilitychange",()=>{
    if(document.hidden) resetInput();
});


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",e=>{
    if(
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight" ||
        e.code === "Space" ||
        e.code === "ArrowUp"
    ){
        e.preventDefault();
    }

    if(e.code === "ArrowLeft") input.left = true;
    if(e.code === "ArrowRight") input.right = true;

    if(e.code === "Space" || e.code === "ArrowUp"){
        if(!input.jump){
            jump();
        }
        input.jump = true;
    }

    if(e.code === "Enter" && state === "menu"){
        startGame();
    }

    if(e.code === "KeyP"){
        activatePOW();
    }
});

window.addEventListener("keyup",e=>{
    if(e.code === "ArrowLeft"){
        input.left = false;
    }

    if(e.code === "ArrowRight"){
        input.right = false;
    }

    if(e.code === "Space" || e.code === "ArrowUp"){
        input.jump = false;
    }
});


/* =========================================================
   iPHONE TOUCH CONTROLS
   =========================================================
   IMPORTANTE:
   No hay listeners globales touchstart/touchmove/touchend
   que bloqueen los botones.
========================================================= */

function bindTouchButton(element,onPress,onRelease){

    let active = false;

    function press(e){
        if(e.cancelable){
            e.preventDefault();
        }

        e.stopPropagation();

        if(active) return;

        active = true;

        onPress();

        element.classList.add("active");
    }

    function release(e){
        if(e.cancelable){
            e.preventDefault();
        }

        e.stopPropagation();

        if(!active) return;

        active = false;

        onRelease();

        element.classList.remove("active");
    }

    element.addEventListener(
        "touchstart",
        press,
        {passive:false}
    );

    element.addEventListener(
        "touchend",
        release,
        {passive:false}
    );

    element.addEventListener(
        "touchcancel",
        release,
        {passive:false}
    );

    element.addEventListener(
        "touchmove",
        e=>{
            if(e.cancelable){
                e.preventDefault();
            }
            e.stopPropagation();
        },
        {passive:false}
    );

    /* También funciona con ratón */

    element.addEventListener("mousedown",e=>{
        e.preventDefault();

        if(active) return;

        active = true;

        onPress();

        element.classList.add("active");
    });

    element.addEventListener("mouseup",e=>{
        e.preventDefault();

        if(!active) return;

        active = false;

        onRelease();

        element.classList.remove("active");
    });

    element.addEventListener("mouseleave",()=>{
        if(active){
            active = false;
            onRelease();
            element.classList.remove("active");
        }
    });
}


bindTouchButton(
    document.getElementById("left"),
    ()=>{
        input.left = true;
    },
    ()=>{
        input.left = false;
    }
);

bindTouchButton(
    document.getElementById("right"),
    ()=>{
        input.right = true;
    },
    ()=>{
        input.right = false;
    }
);

bindTouchButton(
    document.getElementById("jump"),
    ()=>{
        if(!input.jump){
            jump();
        }

        input.jump = true;
    },
    ()=>{
        input.jump = false;
    }
);


/* =========================================================
   START BUTTON
========================================================= */

const startButton = document.getElementById("startButton");

let startLock = false;

function startGame(){

    if(startLock) return;

    startLock = true;

    setTimeout(()=>{
        startLock = false;
    },350);

    score = 0;
    lives = 3;
    phase = 1;

    resetInput();

    player.x = W/2;
    player.y = H - 120;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.platform = -1;
    player.invulnerable = 1.2;

    state = "playing";

    document.getElementById("screen").classList.add("hidden");

    updateHUD();

    beginPhase();
}

startButton.addEventListener("click",startGame);

startButton.addEventListener("touchend",e=>{
    e.preventDefault();
    e.stopPropagation();
    startGame();
},{passive:false});


/* =========================================================
   PLAYER
========================================================= */

const player = {
    x:195,
    y:700,
    w:25,
    h:31,

    vx:0,
    vy:0,

    speed:265,
    jumpPower:650,
    gravity:1450,

    grounded:false,
    platform:-1,

    invulnerable:0
};


/* =========================================================
   LEVEL GENERATION
========================================================= */

function generateLevel(){

    platforms = [];

    const floorY = H - 105;

    platforms.push({
        x:25,
        y:floorY,
        w:W-50,
        h:14,
        type:"floor"
    });

    const usableTop = 145;
    const usableBottom = floorY - 55;

    const gap = Math.min(91,Math.max(70,(usableBottom-usableTop)/4));

    const patterns = [
        [
            [.05,.48],
            [.52,.95],
            [.20,.73],
            [.05,.45]
        ],
        [
            [.05,.40],
            [.48,.94],
            [.10,.58],
            [.42,.90]
        ],
        [
            [.18,.84],
            [.03,.42],
            [.55,.97],
            [.15,.70]
        ],
        [
            [.03,.53],
            [.47,.97],
            [.18,.62],
            [.40,.91]
        ],
        [
            [.05,.36],
            [.40,.76],
            [.64,.96],
            [.17,.63]
        ]
    ];

    const pattern = patterns[(phase-1) % patterns.length];

    for(let i=0;i<4;i++){

        const y = usableBottom - gap*(i+1);

        let x1 = pattern[i][0] * W;
        let x2 = pattern[i][1] * W;

        let width = x2-x1;

        platforms.push({
            x:x1,
            y:y,
            w:width,
            h:13,
            type:"platform"
        });
    }

    pipes = [
        {
            x:8,
            y:floorY-28,
            w:52,
            h:30,
            side:"left"
        },
        {
            x:W-60,
            y:floorY-28,
            w:52,
            h:30,
            side:"right"
        }
    ];

    /*
       POW cambia de posición en cada fase.
    */

    const candidates = platforms.slice(1);

    const index =
        (phase * 7 + 3) % candidates.length;

    const p = candidates[index];

    pow = {
        x:p.x + p.w/2,
        y:p.y - 17,
        r:14,
        uses:3,
        pulse:0
    };
}


/* =========================================================
   PHASE
========================================================= */

function beginPhase(){

    generateLevel();

    enemies = [];

    waveKills = 0;

    waveTarget = Math.min(
        9,
        3 + Math.floor((phase-1)*0.9)
    );

    spawnRemaining = waveTarget;

    spawnTimer = .5;

    player.x = W/2;
    player.y = H - 150;
    player.vx = 0;
    player.vy = 0;
    player.platform = -1;
    player.grounded = false;

    showPhase();

    if(phase > 1){
        phaseTransition = 1.3;
    }
}

function showPhase(){

    const banner =
        document.getElementById("phaseBanner");

    banner.textContent =
        "PHASE " + String(phase).padStart(2,"0");

    banner.style.opacity = "1";

    setTimeout(()=>{
        banner.style.opacity = "0";
    },900);
}


/* =========================================================
   JUMP
========================================================= */

function jump(){

    if(state !== "playing") return;

    if(player.grounded){

        player.vy = -player.jumpPower;

        player.grounded = false;

        player.platform = -1;

        createParticles(
            player.x,
            player.y+player.h/2,
            8,
            1
        );
    }
}


/* =========================================================
   ENEMY SPAWN
========================================================= */

function spawnEnemy(){

    if(spawnRemaining <= 0) return;

    const pipe =
        Math.random() < .5
        ? pipes[0]
        : pipes[1];

    const types = [
        "runner",
        "dropper",
        "charger",
        "hunter"
    ];

    const type =
        types[Math.floor(Math.random()*types.length)];

    let speed =
        65 +
        phase*7 +
        Math.random()*35;

    if(type === "charger"){
        speed += 30;
    }

    if(type === "hunter"){
        speed += 15;
    }

    const fromLeft =
        pipe.side === "left";

    enemies.push({
        x:fromLeft
            ? pipe.x + pipe.w + 6
            : pipe.x - 6,

        y:pipe.y-28,

        w:27,
        h:28,

        vx:fromLeft ? speed : -speed,

        speed:speed,

        type:type,

        platform:0,

        state:"normal",

        stun:0,

        deadTime:0,

        dir:fromLeft ? 1 : -1,

        aiTimer:.5+Math.random()*1.5,

        dropCooldown:1+Math.random()*2,

        flash:0
    });

    spawnRemaining--;
}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(dt){

    if(player.invulnerable > 0){
        player.invulnerable -= dt;
    }

    let direction = 0;

    if(input.left) direction -= 1;
    if(input.right) direction += 1;

    player.vx = direction * player.speed;

    player.x += player.vx * dt;

    /*
       Wrap lateral
    */

    if(player.x < -player.w/2){
        player.x = W + player.w/2;
    }

    if(player.x > W + player.w/2){
        player.x = -player.w/2;
    }

    player.vy += player.gravity * dt;

    const oldBottom =
        player.y + player.h/2;

    player.y += player.vy * dt;

    player.grounded = false;
    player.platform = -1;

    /*
       Colisión con plataformas desde arriba.
    */

    for(let i=0;i<platforms.length;i++){

        const p = platforms[i];

        const playerLeft =
            player.x-player.w/2;

        const playerRight =
            player.x+player.w/2;

        const playerBottom =
            player.y+player.h/2;

        const wasAbove =
            oldBottom <= p.y+5;

        const crossing =
            playerBottom >= p.y &&
            playerBottom <= p.y+20;

        const horizontal =
            playerRight > p.x &&
            playerLeft < p.x+p.w;

        if(
            player.vy >= 0 &&
            wasAbove &&
            crossing &&
            horizontal
        ){

            player.y =
                p.y-player.h/2;

            player.vy = 0;

            player.grounded = true;

            player.platform = i;

            hitPlatform(i);

            break;
        }
    }

    /*
       Caída por debajo
    */

    if(player.y > H+80){
        loseLife();
    }

    /*
       Golpear POW desde abajo
    */

    if(pow && pow.uses > 0){

        const px = player.x;
        const py = player.y-player.h/2;

        const dx = px-pow.x;
        const dy = py-pow.y;

        if(
            Math.abs(dx) < 27 &&
            Math.abs(dy) < 30 &&
            player.vy < 0
        ){

            activatePOW();
        }
    }
}


/* =========================================================
   HIT PLATFORM
========================================================= */

function hitPlatform(index){

    if(index <= 0) return;

    for(const e of enemies){

        if(
            e.state === "normal" &&
            e.platform === index
        ){

            e.state = "stunned";
            e.stun = 2.6;
            e.vx = 0;
            e.flash = .3;

            shake = Math.max(shake,5);

            createParticles(
                e.x,
                e.y,
                10,
                1.4
            );
        }
    }
}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt){

    for(const e of enemies){

        if(e.state === "dead"){

            e.deadTime -= dt;

            e.y += 50*dt;

            continue;
        }

        if(e.flash > 0){
            e.flash -= dt;
        }

        if(e.state === "stunned"){

            e.stun -= dt;

            e.y +=
                Math.sin(time*15+e.x)*.4;

            if(e.stun <= 0){

                e.state = "normal";

                e.vx =
                    e.dir *
                    e.speed *
                    .75;
            }

            continue;
        }

        e.aiTimer -= dt;

        /*
           RUNNER
        */

        if(e.type === "runner"){

            e.vx =
                e.dir *
                e.speed;

            if(e.x < 10){
                e.dir = 1;
            }

            if(e.x > W-10){
                e.dir = -1;
            }
        }

        /*
           DROPPER
        */

        if(e.type === "dropper"){

            e.vx =
                e.dir *
                e.speed*.75;

            e.dropCooldown -= dt;

            if(
                e.dropCooldown <= 0 &&
                e.platform > 0
            ){

                const below =
                    e.platform-1;

                if(below >= 0){

                    e.platform = below;

                    e.y =
                        platforms[below].y-e.h/2;

                    e.dropCooldown =
                        1.2+Math.random()*1.7;

                    createParticles(
                        e.x,
                        e.y,
                        5,
                        .7
                    );
                }
            }
        }

        /*
           CHARGER
        */

        if(e.type === "charger"){

            if(e.aiTimer <= 0){

                e.aiTimer =
                    1.4+Math.random()*1.5;

                e.dir =
                    player.x > e.x ? 1 : -1;

                e.vx =
                    e.dir *
                    e.speed *
                    1.8;
            }
        }

        /*
           HUNTER
        */

        if(e.type === "hunter"){

            if(e.aiTimer <= 0){

                e.aiTimer =
                    .8+Math.random()*1.2;

                e.dir =
                    player.x > e.x ? 1 : -1;
            }

            e.vx =
                e.dir *
                e.speed;
        }

        e.x += e.vx*dt;

        /*
           Bordes
        */

        if(e.x < -25){

            e.x = -25;
            e.dir = 1;
        }

        if(e.x > W+25){

            e.x = W+25;
            e.dir = -1;
        }

        /*
           Colisión con jugador
        */

        if(
            player.invulnerable <= 0 &&
            Math.abs(player.x-e.x) <
                (player.w+e.w)*.42 &&
            Math.abs(player.y-e.y) <
                (player.h+e.h)*.45
        ){

            if(player.vy > 100){

                kickEnemy(e);

            }else{

                loseLife();
            }
        }
    }

    enemies =
        enemies.filter(e=>{
            return !(
                e.state === "dead" &&
                e.deadTime <= 0
            );
        });
}


/* =========================================================
   KICK STUNNED ENEMY
========================================================= */

function kickEnemy(e){

    if(e.state !== "stunned") return;

    e.state = "dead";
    e.deadTime = .8;

    score += 500 + phase*100;

    waveKills++;

    shake = 8;

    createParticles(
        e.x,
        e.y,
        22,
        2
    );

    updateHUD();
}


/* =========================================================
   POW
========================================================= */

function activatePOW(){

    if(
        state !== "playing" ||
        !pow ||
        pow.uses <= 0
    ){
        return;
    }

    pow.uses--;

    shake = 15;

    createParticles(
        pow.x,
        pow.y,
        35,
        2
    );

    /*
       No mata directamente.
       Solo deja a los enemigos vulnerables.
    */

    for(const e of enemies){

        if(
            e.state === "normal" &&
            e.platform >= 0
        ){

            e.state = "stunned";
            e.stun = 3;
            e.vx = 0;
            e.flash = .5;
        }
    }
}


/* =========================================================
   LIVES
========================================================= */

function loseLife(){

    if(player.invulnerable > 0) return;

    lives--;

    shake = 18;

    createParticles(
        player.x,
        player.y,
        25,
        2
    );

    updateHUD();

    if(lives <= 0){

        gameOver();

        return;
    }

    player.x = W/2;
    player.y = H-150;

    player.vx = 0;
    player.vy = 0;

    player.invulnerable = 2;

    resetInput();
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    state = "gameover";

    resetInput();

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "pipeBrawl83HighScore",
            String(highScore)
        );
    }

    document.getElementById("screenMessage").innerHTML =
        "GAME OVER<br><span style='font-size:14px;opacity:.6'>SCORE "+score+"</span>";

    document.getElementById("startButton").textContent =
        "RESTART";

    document.getElementById("screen").classList.remove("hidden");

    updateHUD();
}


/* =========================================================
   WAVE CHECK
========================================================= */

function checkWave(){

    /*
       El avance depende de enemigos realmente derrotados,
       no de que el array esté vacío.
    */

    if(
        state === "playing" &&
        spawnRemaining === 0 &&
        waveKills >= waveTarget
    ){

        phase++;

        score += 1000;

        updateHUD();

        beginPhase();
    }
}


/* =========================================================
   SPAWN TIMER
========================================================= */

function updateSpawner(dt){

    if(spawnRemaining <= 0) return;

    spawnTimer -= dt;

    if(spawnTimer <= 0){

        spawnEnemy();

        spawnTimer =
            Math.max(
                .65,
                1.25 -
                phase*.04
            ) +
            Math.random()*.65;
    }
}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(x,y,count,power=1){

    for(let i=0;i<count;i++){

        const a =
            Math.random()*Math.PI*2;

        const s =
            (40+Math.random()*150)*power;

        particles.push({
            x:x,
            y:y,
            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,
            life:.35+Math.random()*.65,
            max:.35+Math.random()*.65,
            size:2+Math.random()*4
        });
    }
}

function updateParticles(dt){

    for(const p of particles){

        p.life -= dt;

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vy += 260*dt;

        p.vx *= .985;
        p.vy *= .985;
    }

    particles =
        particles.filter(p=>p.life>0);
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground(){

    ctx.fillStyle="#050712";
    ctx.fillRect(0,0,W,H);

    /*
       Grid
    */

    ctx.save();

    ctx.globalAlpha=.12;

    ctx.strokeStyle="#263152";
    ctx.lineWidth=1;

    const grid=32;

    for(let x=0;x<W;x+=grid){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=grid){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    ctx.restore();

    /*
       Decorative lights
    */

    for(let i=0;i<20;i++){

        const x =
            (i*83+phase*17)%W;

        const y =
            90+(i*53)%Math.max(100,H-180);

        ctx.fillStyle=
            "rgba(90,110,170,.12)";

        ctx.fillRect(x,y,2,2);
    }
}


/* =========================================================
   DRAW PLATFORMS
========================================================= */

function drawPlatforms(){

    for(let i=0;i<platforms.length;i++){

        const p=platforms[i];

        ctx.save();

        ctx.shadowBlur=12;
        ctx.shadowColor=
            "rgba(75,120,255,.45)";

        ctx.fillStyle="#263451";

        ctx.fillRect(
            p.x,
            p.y,
            p.w,
            p.h
        );

        ctx.shadowBlur=0;

        ctx.fillStyle="#7184ad";

        ctx.fillRect(
            p.x,
            p.y,
            p.w,
            3
        );

        ctx.fillStyle="#121a2b";

        ctx.fillRect(
            p.x,
            p.y+5,
            p.w,
            p.h-5
        );

        ctx.restore();
    }
}


/* =========================================================
   DRAW PIPES
========================================================= */

function drawPipes(){

    for(const p of pipes){

        ctx.save();

        ctx.shadowBlur=16;
        ctx.shadowColor=
            "rgba(0,255,100,.35)";

        ctx.fillStyle="#126b3a";

        ctx.fillRect(
            p.x+7,
            p.y,
            p.w-14,
            p.h
        );

        ctx.fillStyle="#1c9b52";

        ctx.fillRect(
            p.x,
            p.y,
            p.w,
            10
        );

        ctx.fillStyle="#42d878";

        ctx.fillRect(
            p.x+4,
            p.y+2,
            p.w-8,
            3
        );

        ctx.restore();
    }
}


/* =========================================================
   DRAW POW
========================================================= */

function drawPOW(){

    if(!pow) return;

    if(pow.uses <= 0) return;

    pow.pulse += .06;

    const scale =
        1+Math.sin(pow.pulse)*.08;

    ctx.save();

    ctx.translate(pow.x,pow.y);

    ctx.scale(scale,scale);

    ctx.shadowBlur=22;
    ctx.shadowColor="#e9f1ff";

    ctx.fillStyle="#d9e5ff";

    ctx.fillRect(
        -14,
        -12,
        28,
        24
    );

    ctx.fillStyle="#384c78";

    ctx.fillRect(
        -10,
        -7,
        20,
        14
    );

    ctx.fillStyle="#fff";

    ctx.font="900 12px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText("POW",0,1);

    ctx.restore();
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    if(
        player.invulnerable > 0 &&
        Math.floor(time*12)%2 === 0
    ){
        return;
    }

    ctx.save();

    ctx.translate(player.x,player.y);

    /*
       Shadow
    */

    ctx.globalAlpha=.3;

    ctx.fillStyle="#000";

    ctx.beginPath();

    ctx.ellipse(
        0,
        player.h/2+5,
        15,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;

    /*
       Body
    */

    ctx.shadowBlur=12;
    ctx.shadowColor="#6da8ff";

    ctx.fillStyle="#e74c3c";

    ctx.fillRect(
        -11,
        -4,
        22,
        17
    );

    /*
       Head
    */

    ctx.fillStyle="#ffd0a6";

    ctx.fillRect(
        -9,
        -17,
        18,
        15
    );

    /*
       Helmet
    */

    ctx.fillStyle="#ef3b30";

    ctx.fillRect(
        -11,
        -20,
        22,
        6
    );

    ctx.fillStyle="#ff6458";

    ctx.fillRect(
        -7,
        -22,
        14,
        3
    );

    /*
       Legs
    */

    ctx.fillStyle="#2865bd";

    ctx.fillRect(
        -9,
        13,
        7,
        11
    );

    ctx.fillRect(
        2,
        13,
        7,
        11
    );

    /*
       Boots
    */

    ctx.fillStyle="#e8a13a";

    ctx.fillRect(
        -11,
        22,
        10,
        4
    );

    ctx.fillRect(
        1,
        22,
        10,
        4
    );

    /*
       Eye
    */

    ctx.fillStyle="#151923";

    ctx.fillRect(
        3,
        -13,
        3,
        4
    );

    ctx.restore();
}


/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemy(e){

    if(e.state === "dead"){

        ctx.save();

        ctx.globalAlpha=
            Math.max(0,e.deadTime);

        ctx.translate(e.x,e.y);

        ctx.rotate(
            (1-e.deadTime)*Math.PI*3
        );

        drawEnemyBody(e);

        ctx.restore();

        return;
    }

    ctx.save();

    ctx.translate(e.x,e.y);

    if(e.state === "stunned"){

        ctx.rotate(
            Math.sin(time*12)*.15
        );
    }

    if(e.flash > 0){

        ctx.shadowBlur=25;
        ctx.shadowColor="#fff";
    }

    drawEnemyBody(e);

    ctx.restore();
}

function drawEnemyBody(e){

    let body="#e84c75";

    if(e.type==="runner"){
        body="#e84c75";
    }

    if(e.type==="dropper"){
        body="#9c68ed";
    }

    if(e.type==="charger"){
        body="#ef8c3a";
    }

    if(e.type==="hunter"){
        body="#3ac9c1";
    }

    ctx.fillStyle=body;

    ctx.fillRect(
        -13,
        -12,
        26,
        22
    );

    ctx.fillStyle="#111827";

    ctx.fillRect(
        -9,
        -7,
        7,
        6
    );

    ctx.fillRect(
        2,
        -7,
        7,
        6
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
        -7,
        -5,
        3,
        3
    );

    ctx.fillRect(
        4,
        -5,
        3,
        3
    );

    /*
       Legs
    */

    ctx.fillStyle=body;

    ctx.fillRect(
        -10,
        10,
        7,
        7
    );

    ctx.fillRect(
        3,
        10,
        7,
        7
    );

    /*
       Stun stars
    */

    if(e.state==="stunned"){

        ctx.fillStyle="#ffe66d";

        ctx.font="bold 12px Arial";
        ctx.textAlign="center";

        ctx.fillText(
            "✦",
            -14,
            -18
        );

        ctx.fillText(
            "✦",
            14,
            -19
        );
    }
}


/* =========================================================
   DRAW PARTICLES
========================================================= */

function drawParticles(){

    for(const p of particles){

        const alpha =
            Math.max(0,p.life/p.max);

        ctx.save();

        ctx.globalAlpha=alpha;

        ctx.fillStyle="#d8e6ff";

        ctx.shadowBlur=10;
        ctx.shadowColor="#6da8ff";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

        ctx.restore();
    }
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.save();

    if(shake > 0){

        const sx =
            (Math.random()-.5)*shake;

        const sy =
            (Math.random()-.5)*shake;

        ctx.translate(sx,sy);
    }

    drawBackground();
    drawPlatforms();
    drawPipes();
    drawPOW();

    for(const e of enemies){
        drawEnemy(e);
    }

    drawPlayer();
    drawParticles();

    ctx.restore();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("score").textContent =
        String(score).padStart(6,"0");

    document.getElementById("best").textContent =
        String(Math.max(score,highScore))
        .padStart(6,"0");

    document.getElementById("phase").textContent =
        String(phase).padStart(2,"0");

    document.getElementById("lives").textContent =
        "♥".repeat(Math.max(0,lives));
}


/* =========================================================
   LOOP
========================================================= */

let last = performance.now();

function loop(now){

    const raw =
        (now-last)/1000;

    last=now;

    const dt =
        Math.min(raw,.033);

    time += dt;

    if(state === "playing"){

        updatePlayer(dt);
        updateSpawner(dt);
        updateEnemies(dt);
        updateParticles(dt);

        checkWave();

        if(shake > 0){
            shake *= .88;

            if(shake < .1){
                shake=0;
            }
        }
    }

    if(state !== "playing"){

        updateParticles(dt);

        if(shake > 0){
            shake *= .88;
        }
    }

    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   INITIALIZATION
========================================================= */

resize();

updateHUD();

requestAnimationFrame(loop);


/* =========================================================
   iOS SAFETY
   Evita gestos del navegador sin bloquear los botones.
========================================================= */

document.addEventListener(
    "gesturestart",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

document.addEventListener(
    "gesturechange",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

document.addEventListener(
    "gestureend",
    e=>{
        e.preventDefault();
    },
    {passive:false}
);

</script>
</body>
