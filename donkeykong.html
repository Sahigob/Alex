<style>

    left:102px;
    bottom:47px;
}

#jump{
    right:100px;

    width:90px;
}

    right:16px;
    bottom:47px;

}

    bottom:153px;

    color:#fff;

    inset:0;

<script>
"use strict";

/* =========================================================
   JUNGLE KONG ARCADE
   Canvas arcade 80s
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

let W = 360;
let H = 640;

function resize(){

    const rect = canvas.getBoundingClientRect();

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = Math.floor(rect.width*dpr);
    canvas.height = Math.floor(rect.height*dpr);

    W = canvas.width;
    H = canvas.height;

    ctx.setTransform(
        canvas.width/360,
        0,
        0,
        canvas.height/640,
        0,
        0
    );

    ctx.imageSmoothingEnabled=false;
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx=null;

function audioStart(){

    if(!audioCtx){

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AC){
            audioCtx=new AC();
        }
    }

    if(audioCtx && audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}

function beep(freq=440,duration=.08,type="square",volume=.035){

    if(!audioCtx) return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration);
}

function jumpSound(){
    beep(320,.06);
    setTimeout(()=>beep(620,.08),45);
}

function barrelSound(){
    beep(110,.035,"square",.025);
}

function hitSound(){
    beep(90,.12,"sawtooth",.04);
}

function scoreSound(){
    beep(900,.04);
    setTimeout(()=>beep(1200,.06),45);
}

function deathSound(){

    beep(300,.08,"square",.04);

    setTimeout(()=>{
        beep(180,.12,"square",.04);
    },90);

    setTimeout(()=>{
        beep(90,.25,"square",.04);
    },220);
}


/* =========================================================
   INPUT
   ========================================================= */

const keys={
    left:false,
    right:false,
    jump:false,
    hammer:false
};

let jumpPressed=false;
let hammerPressed=false;

window.addEventListener("keydown",e=>{

    audioStart();

    if(
        ["ArrowLeft","ArrowRight","ArrowUp",
         "ArrowDown"," ","z","Z","x","X","Enter"]
        .includes(e.key)
    ){
        e.preventDefault();
    }

    if(e.key==="ArrowLeft"){
        keys.left=true;
    }

    if(e.key==="ArrowRight"){
        keys.right=true;
    }

    if(e.key==="ArrowUp" || e.key===" "){
        if(!keys.jump){
            jumpPressed=true;
        }
        keys.jump=true;
    }

    if(e.key==="z" || e.key==="Z"){
        if(!keys.hammer){
            hammerPressed=true;
        }
        keys.hammer=true;
    }

    if(e.key==="Enter"){
        if(game.state==="title" ||
           game.state==="gameover" ||
           game.state==="win"){

            startGame();
        }
    }
});

window.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft"){
        keys.left=false;
    }

    if(e.key==="ArrowRight"){
        keys.right=false;
    }

    if(e.key==="ArrowUp" || e.key===" "){
        keys.jump=false;
    }

    if(e.key==="z" || e.key==="Z"){
        keys.hammer=false;
    }
});


function bindButton(id,property,pressedSetter){

    const el=document.getElementById(id);

    const down=e=>{

        e.preventDefault();
        audioStart();

        if(!keys[property]){
            pressedSetter();
        }

        keys[property]=true;
    };

    const up=e=>{

        e.preventDefault();
        keys[property]=false;
    };

    el.addEventListener("touchstart",down,{passive:false});
    el.addEventListener("touchend",up,{passive:false});
    el.addEventListener("touchcancel",up,{passive:false});

    el.addEventListener("mousedown",down);
    el.addEventListener("mouseup",up);
    el.addEventListener("mouseleave",up);
}

bindButton(
    "left",
    "left",
    ()=>{}
);

bindButton(
    "right",
    "right",
    ()=>{}
);

bindButton(
    "jump",
    "jump",
    ()=>jumpPressed=true
);

bindButton(
    "hammer",
    "hammer",
    ()=>hammerPressed=true
);

document.getElementById("startTouch")
.addEventListener("click",()=>{
    audioStart();
    startGame();
});


/* =========================================================
   GAME
   ========================================================= */

const GAME_W=360;
const GAME_H=640;

let game={
    state:"title",
    score:0,
    high:Number(localStorage.getItem("kongHighScore")||0),
    lives:3,
    level:1,
    timer:0,
    levelTimer:0,
    deathTimer:0,
    flash:0
};


/* =========================================================
   PLAYER
   ========================================================= */

const player={
    x:42,
    y:550,
    w:18,
    h:25,

    vx:0,
    vy:0,

    speed:1.45,
    jump:-7.3,

    grounded:false,

    facing:1,

    anim:0,

    hammer:0,
    hammerTimer:0,

    invincible:0
};


/* =========================================================
   LEVEL DATA
   ========================================================= */

let platforms=[];
let ladders=[];
let barrels=[];
let sparks=[];

let kong={
    x:268,
    y:50,
    w:62,
    h:55,
    anim:0
};

let princess={
    x:292,
    y:86,
    w:18,
    h:25
};


/* =========================================================
   LEVEL CREATION
   ========================================================= */

       Coordenadas diseñadas para pantalla 360x640.

    */

            {x:30,y:350,w:320,tilt:-.045},
            {x:8,y:275,w:320,tilt:.045},
            {x:28,y:200,w:320,tilt:-.045},
            {x:8,y:135,w:325,tilt:.045}
        ];

        ladders=[
            {x:285,y:500,h:75},
            {x:48,y:425,h:75},
            {x:275,y:350,h:75},

    }else if(level===3){

        platforms=[
            {x:5,y:575,w:350,tilt:0},
            {x:15,y:495,w:330,tilt:-.08},
            {x:10,y:410,w:330,tilt:.08},
            {x:20,y:325,w:320,tilt:-.08},
            {x:8,y:240,w:330,tilt:.08},
            {x:25,y:160,w:315,tilt:-.08},
            {x:20,y:105,w:320,tilt:0}
        ];

        ladders=[
            {x:290,y:495,h:85},
            {x:55,y:410,h:85},
            {x:285,y:325,h:85},
            {x:55,y:240,h:85},
            {x:280,y:160,h:80},
            {x:150,y:105,h:55}
        ];

    }else{

        platforms=[
            {x:5,y:575,w:350,tilt:0},
            {x:15,y:505,w:325,tilt:.10},
            {x:10,y:425,w:335,tilt:-.10},
            {x:20,y:345,w:320,tilt:.10},
            {x:10,y:265,w:335,tilt:-.10},
            {x:20,y:185,w:320,tilt:.10},
            {x:10,y:120,w:340,tilt:-.10}
        ];

        ladders=[
            {x:65,y:505,h:80},
            {x:275,y:425,h:80},
            {x:65,y:345,h:80},
            {x:275,y:265,h:80},

        ];
    }


    player.x=42;
    player.y=platforms[0].y-player.h;
    player.vx=0;
    player.vy=0;
    player.grounded=true;

    kong.x=268;
    kong.y=42;

    princess.x=292;
    princess.y=platforms[platforms.length-1].y-30;

    game.levelTimer=0;

    /*
       Barriles iniciales
    */

    spawnBarrel(285,110,1);
    spawnBarrel(305,110,1);
}


function spawnBarrel(x,y,direction){

    barrels.push({

        x,
        y,

        r:10,

        vx:direction*1.15,
        vy:0,

        rotation:0,

        falling:false,

        life:1000,

        color:Math.random()<.5 ? 0 : 1
    });
}


/* =========================================================
   GEOMETRY
   ========================================================= */

function platformY(p,x){

    const t=(x-p.x)/p.w;

    return p.y + Math.sin(p.tilt)*t*12;
}


function rectsOverlap(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground(){

    ctx.fillStyle="#000";
    ctx.fillRect(0,0,360,640);

    /*
       Estrellas/píxeles de fondo
    */

    ctx.fillStyle="#171717";

    for(let i=0;i<35;i++){

        const x=(i*73)%360;
        const y=(i*47)%110;

        ctx.fillRect(x,y,1,1);
    }

    /*
       HUD
    */

    ctx.fillStyle="#fff";
    ctx.font="bold 11px monospace";

    ctx.fillText("JUNGLE KONG",10,14);

    ctx.fillStyle="#ffdf00";
    ctx.fillText(
        String(game.score).padStart(6,"0"),
        10,
        30
    );

    ctx.fillStyle="#fff";
    ctx.fillText("HI",135,14);

    ctx.fillStyle="#ffdf00";
    ctx.fillText(
        String(game.high).padStart(6,"0"),
        118,
        30
    );

    ctx.fillStyle="#fff";
    ctx.fillText("L-"+game.level,285,14);

    ctx.fillText("♥".repeat(game.lives),280,30);
}


/* =========================================================
   DRAW KONG
   ========================================================= */

function drawKong(){

    const x=kong.x;
    const y=kong.y;

    kong.anim+=.05;

    const bounce=
        Math.sin(kong.anim)*1.5;

    /*
       Sombra
    */

    ctx.fillStyle="#4b1c0b";
    ctx.fillRect(x+8,y+51,45,5);

    /*
       Cuerpo
    */

    ctx.fillStyle="#6b2c10";

    ctx.fillRect(
        x+9,
        y+17+bounce,
        43,
        35
    );

    ctx.fillRect(
        x+3,
        y+25+bounce,
        55,
        25
    );

    /*
       cabeza
    */

    ctx.fillStyle="#7b3512";

    ctx.fillRect(
        x+10,
        y+2+bounce,
        39,
        27
    );

    /*
       orejas
    */

    ctx.fillRect(x+5,y+10+bounce,8,10);
    ctx.fillRect(x+47,y+10+bounce,8,10);

    /*
       cara
    */

    ctx.fillStyle="#a95724";

    ctx.fillRect(
        x+15,
        y+11+bounce,
        30,
        14
    );

    /*
       ojos
    */

    ctx.fillStyle="#fff";

    ctx.fillRect(x+19,y+8+bounce,7,6);
    ctx.fillRect(x+35,y+8+bounce,7,6);

    ctx.fillStyle="#000";

    ctx.fillRect(x+22,y+9+bounce,3,4);
    ctx.fillRect(x+38,y+9+bounce,3,4);

    /*
       nariz
    */

    ctx.fillStyle="#4b1b0b";

    ctx.fillRect(
        x+28,
        y+16+bounce,
        7,
        5
    );

    /*
       boca
    */

    ctx.fillStyle="#1b0803";

    ctx.fillRect(
        x+20,
        y+22+bounce,
        24,
        4
    );

    /*
       brazos
    */

    ctx.fillStyle="#6b2c10";

    ctx.fillRect(x-5,y+29+bounce,13,10);
    ctx.fillRect(x+51,y+29+bounce,13,10);

    /*
       puños
    */

    ctx.fillRect(x-8,y+36+bounce,12,12);
    ctx.fillRect(x+56,y+36+bounce,12,12);
}


/* =========================================================
   DRAW PRINCESS
   ========================================================= */

function drawPrincess(){

    const x=princess.x;
    const y=princess.y;

    /*
       pelo
    */

    ctx.fillStyle="#e9b000";

    ctx.fillRect(x+2,y,14,8);
    ctx.fillRect(x,y+5,18,8);

    /*
       cara
    */

    ctx.fillStyle="#ffd6b0";

    ctx.fillRect(x+4,y+7,10,9);

    /*
       vestido
    */

    ctx.fillStyle="#ff2a2a";

    ctx.fillRect(x+2,y+15,15,9);
    ctx.fillRect(x,y+22,19,5);

    /*
       ojos
    */

    ctx.fillStyle="#000";

    ctx.fillRect(x+6,y+10,2,2);
    ctx.fillRect(x+11,y+10,2,2);
}


/* =========================================================
   DRAW PLATFORMS
   ========================================================= */

function drawPlatforms(){

    for(const p of platforms){

        /*
           base
        */

        ctx.save();

        ctx.translate(p.x,p.y);
        ctx.rotate(p.tilt);

        /*
           sombra
        */

        ctx.fillStyle="#240000";

        ctx.fillRect(
            0,
            0,
            p.w,
            9
        );

        /*
           estructura azul
        */

        ctx.fillStyle="#0b45a8";

        ctx.fillRect(
            0,
            0,
            p.w,
            5
        );

        /*
           superficie roja
        */

        ctx.fillStyle="#d90000";

        for(let x=0;x<p.w;x+=18){

            ctx.fillRect(
                x,
                0,
                14,
                4
            );
        }

        /*
           remaches
        */

        ctx.fillStyle="#ffdb00";

        for(let x=7;x<p.w;x+=36){

            ctx.fillRect(
                x,
                5,
                3,
                3
            );
        }

        ctx.restore();
    }
}


/* =========================================================
   DRAW LADDERS
   ========================================================= */

function drawLadders(){

    for(const l of ladders){

        ctx.fillStyle="#e0a900";

        ctx.fillRect(
            l.x,
            l.y,
            5,
            l.h
        );

        ctx.fillRect(
            l.x+13,
            l.y,
            5,
            l.h
        );

        for(let y=l.y+5;y<l.y+l.h;y+=12){

            ctx.fillRect(
                l.x,
                y,
                18,
                4
            );
        }
    }
}


/* =========================================================
   DRAW PLAYER
   ========================================================= */

function drawPlayer(){

    const x=Math.round(player.x);
    const y=Math.round(player.y);

    let walk=
        player.grounded &&
        Math.abs(player.vx)>.1 ?
        Math.floor(player.anim/5)%2 :
        0;

    /*
       sombra
    */

    ctx.fillStyle="#000";

    ctx.fillRect(
        x+2,
        y+24,
        15,
        3
    );

    /*
       piernas
    */

    ctx.fillStyle="#0054b8";

    if(walk===0){

        ctx.fillRect(x+4,y+17,5,8);
        ctx.fillRect(x+11,y+17,5,8);

    }else{

        ctx.fillRect(x+2,y+16,5,9);
        ctx.fillRect(x+12,y+18,5,7);
    }

    /*
       botas
    */

    ctx.fillStyle="#8b1a12";

    ctx.fillRect(x+1,y+23,8,3);
    ctx.fillRect(x+11,y+23,8,3);

    /*
       cuerpo
    */

    ctx.fillStyle="#e1251b";

    ctx.fillRect(
        x+3,
        y+8,
        14,
        12
    );

    /*
       mono
    */

    ctx.fillStyle="#004db4";

    ctx.fillRect(
        x+5,
        y+13,
        10,
        8
    );

    /*
       cabeza
    */

    ctx.fillStyle="#ffbd7a";

    ctx.fillRect(
        x+4,
        y+2,
        13,
        10
    );

    /*
       pelo
    */

    ctx.fillStyle="#6d220e";

    ctx.fillRect(x+3,y,15,5);
    ctx.fillRect(x+2,y+3,5,5);

    /*
       gorra
    */

    ctx.fillStyle="#e1251b";

    ctx.fillRect(x+3,y-2,14,4);
    ctx.fillRect(x+1,y+1,17,3);

    /*
       ojo
    */

    ctx.fillStyle="#000";

    ctx.fillRect(
        player.facing>0 ? x+13 : x+5,
        y+6,
        2,
        2
    );

    /*
       brazos
    */

    ctx.fillStyle="#ffbd7a";

    if(player.hammerTimer>0){

        ctx.fillRect(
            x-2,
            y+7,
            5,
            5
        );

        ctx.fillRect(
            x+14,
            y+5,
            5,
            5
        );

    }else{

        ctx.fillRect(
            player.facing>0 ? x+14 : x-2,
            y+9,
            5,
            5
        );
    }


    /*
       martillo
    */

    if(player.hammerTimer>0){

        ctx.fillStyle="#c0c0c0";

        if(player.facing>0){

            ctx.fillRect(
                x+17,
                y-3,
                4,
                18
            );

            ctx.fillStyle="#777";

            ctx.fillRect(
                x+14,
                y-6,
                11,
                6
            );

        }else{

            ctx.fillRect(
                x-4,
                y-3,
                4,
                18
            );

            ctx.fillStyle="#777";

            ctx.fillRect(
                x-7,
                y-6,
                11,
                6
            );
        }
    }
}


/* =========================================================
   DRAW BARREL
   ========================================================= */

function drawBarrel(b){

    ctx.save();

    ctx.translate(
        Math.round(b.x),
        Math.round(b.y)
    );

    ctx.rotate(b.rotation);

    /*
       cuerpo
    */

    ctx.fillStyle=
        b.color===0 ?
        "#b45a16" :
        "#c87518";

    ctx.fillRect(-9,-9,18,18);

    /*
       bandas
    */

    ctx.fillStyle="#3c1b09";

    ctx.fillRect(-10,-7,20,3);
    ctx.fillRect(-10,4,20,3);

    /*
       extremos
    */

    ctx.fillStyle="#6e310d";

    ctx.fillRect(-7,-9,14,3);
    ctx.fillRect(-7,6,14,3);

    /*
       centro
    */

    ctx.fillStyle="#f0a52b";

    ctx.fillRect(-4,-4,8,8);

    ctx.restore();
}


/* =========================================================
   SPARKS
   ========================================================= */

function spawnSpark(x,y){

    sparks.push({
        x,
        y,
        vx:(Math.random()-.5)*2,
        vy:(Math.random()-.5)*2,
        life:20
    });
}

function drawSparks(){

    for(const s of sparks){

        ctx.fillStyle="#fff";

        ctx.fillRect(
            Math.round(s.x),
            Math.round(s.y),
            2,
            2
        );
    }
}


/* =========================================================
   PHYSICS
   ========================================================= */

function getPlatformBelow(x,y){

    let best=null;

    for(const p of platforms){

        if(
            x >= p.x &&
            x <= p.x+p.w
        ){

            const py=platformY(p,x);

            if(
                py >= y-5 &&
                py <= y+18
            ){

                if(!best || py<best.y){
                    best={
                        platform:p,
                        y:py
                    };
                }
            }
        }
    }

    return best;
}


function ladderAt(x,y){

    for(const l of ladders){

        if(
            x+player.w/2 >= l.x-5 &&
            x+player.w/2 <= l.x+l.w+5 &&
            y+player.h >= l.y &&
            y <= l.y+l.h
        ){

            return l;
        }
    }

    return null;
}


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer(){

    if(player.invincible>0){
        player.invincible--;
    }

    /*
       movimiento
    */

    if(keys.left){

        player.vx=-player.speed;
        player.facing=-1;

    }else if(keys.right){

        player.vx=player.speed;
        player.facing=1;

    }else{

        player.vx*=.72;

        if(Math.abs(player.vx)<.03){
            player.vx=0;
        }
    }

    player.x+=player.vx;

    /*
       límites
    */

    if(player.x<5){
        player.x=5;
    }

    if(player.x>337){
        player.x=337;
    }


    /*
       salto
    */

    if(
        jumpPressed &&
        player.grounded
    ){

        player.vy=player.jump;
        player.grounded=false;

        jumpSound();
    }

    jumpPressed=false;


    /*
       gravedad
    */

    player.vy+=.27;

    player.y+=player.vy;


    /*
       aterrizaje
    */

    const below=getPlatformBelow(
        player.x+player.w/2,
        player.y+player.h
    );

    if(
        below &&
        player.vy>=0
    ){

        player.y=
            below.y-player.h;

        player.vy=0;
        player.grounded=true;

    }else{

        player.grounded=false;
    }


    /*
       animación
    */

    if(Math.abs(player.vx)>.1){
        player.anim++;
    }


    /*
       martillo
    */

    if(hammerPressed){

        player.hammerTimer=75;
        hammerPressed=false;

        beep(190,.06);
    }

    if(player.hammerTimer>0){
        player.hammerTimer--;
    }
}


/* =========================================================
   UPDATE BARRELS
   ========================================================= */

function updateBarrels(){

    for(let i=barrels.length-1;i>=0;i--){

        const b=barrels[i];

        b.life--;

        if(b.life<=0){

            barrels.splice(i,1);
            continue;
        }

        /*
           gravedad
        */

        b.vy+=.24;

        /*
           movimiento horizontal
        */

        b.x+=b.vx;

        /*
           rebote bordes
        */

        if(b.x<10){

            b.x=10;
            b.vx=Math.abs(b.vx);

        }

        if(b.x>350){

            b.x=350;
            b.vx=-Math.abs(b.vx);
        }


        /*
           suelo / plataforma
        */

        const below=getBarrelPlatform(b);

        if(
            below &&
            b.vy>=0
        ){

            b.y=below.y-b.r;

            b.vy=0;

            /*
               inclinación de plataforma
               cambia dirección
            */

            if(below.platform.tilt>0){
                b.vx=Math.abs(b.vx);
            }else if(below.platform.tilt<0){
                b.vx=-Math.abs(b.vx);
            }

        }else{

            b.y+=b.vy;
        }

        /*
           rotación
        */

        b.rotation+=b.vx*.08;

        /*
           posibilidad de caer por un extremo
        */

        if(
            b.y>610
        ){

            barrels.splice(i,1);
        }
    }


    /*
       Generación periódica
    */

    if(
        Math.random()<
        .006 + game.level*.002
    ){

        if(barrels.length<4+game.level){

            spawnBarrel(
                kong.x+15,
                kong.y+53,
                Math.random()<.5 ? -1 : 1
            );
        }
    }
}


function getBarrelPlatform(b){

    let best=null;

    for(const p of platforms){

        if(
            b.x>=p.x &&
            b.x<=p.x+p.w
        ){

            const py=platformY(p,b.x);

            if(
                py>=b.y-8 &&
                py<=b.y+25
            ){

                if(!best || py<best.y){

                    best={
                        platform:p,
                        y:py
                    };
                }
            }
        }
    }

    return best;
}


/* =========================================================
   COLLISIONS
   ========================================================= */

function updateCollisions(){

    /*
       Barriles contra jugador
    */

    const pr={
        x:player.x,
        y:player.y,
        w:player.w,
        h:player.h
    };

    for(let i=barrels.length-1;i>=0;i--){

        const b=barrels[i];

        const br={
            x:b.x-b.r,
            y:b.y-b.r,
            w:b.r*2,
            h:b.r*2
        };

        if(rectsOverlap(pr,br)){

            if(player.invincible<=0){

                if(player.hammerTimer>0){

                    /*
                       destruir barril
                    */

                    barrels.splice(i,1);

                    game.score+=500;

                    scoreSound();

                    for(let k=0;k<10;k++){
                        spawnSpark(b.x,b.y);
                    }

                }else{

                    loseLife();
                }
            }
        }
    }


    /*
       martillo
    */

    if(player.hammerTimer>0){

        const hx={
            x:player.facing>0 ?
                player.x+14 :
                player.x-18,

            y:player.y-8,

            w:22,
            h:32
        };

        for(let i=barrels.length-1;i>=0;i--){

            const b=barrels[i];

            const br={
                x:b.x-9,
                y:b.y-9,
                w:18,
                h:18
            };

            if(rectsOverlap(hx,br)){

                barrels.splice(i,1);

                game.score+=500;

                scoreSound();

                for(let k=0;k<10;k++){
                    spawnSpark(b.x,b.y);
                }
            }
        }
    }


    /*
       princesa
    */

    if(
        player.y < 150 &&
        Math.abs(
            player.x-princess.x
        )<28
    ){

        levelComplete();
    }
}


/* =========================================================
   DEATH
   ========================================================= */

function loseLife(){

    if(game.state!=="playing"){
        return;
    }

    game.lives--;

    deathSound();

    player.invincible=120;

    game.flash=20;

    if(game.lives<=0){

        game.state="gameover";

        saveHighScore();

    }else{

        game.deathTimer=70;
    }
}


function respawn(){

    player.x=42;

    player.y=
        platforms[0].y-player.h;

    player.vx=0;
    player.vy=0;

    player.grounded=true;

    player.invincible=100;

    barrels=[];
}


/* =========================================================
   LEVEL COMPLETE
   ========================================================= */

function levelComplete(){

    if(game.state!=="playing"){
        return;
    }

    game.score+=1000*game.level;

    scoreSound();

    game.state="levelComplete";

    game.deathTimer=100;
}


function nextLevel(){

    if(game.level>=4){

        game.state="win";

        saveHighScore();

        return;
    }

    game.level++;

    createLevel(game.level);

    game.state="playing";
}


/* =========================================================
   UPDATE SPARKS
   ========================================================= */

function updateSparks(){

    for(let i=sparks.length-1;i>=0;i--){

        const s=sparks[i];

        s.x+=s.vx;
        s.y+=s.vy;

        s.life--;

        if(s.life<=0){
            sparks.splice(i,1);
        }
    }
}


/* =========================================================
   GAME UPDATE
   ========================================================= */

function update(){

    game.timer++;

    if(game.flash>0){
        game.flash--;
    }

    updateSparks();

    if(game.state==="playing"){

        game.levelTimer++;

        if(game.deathTimer>0){

            game.deathTimer--;

            if(game.deathTimer===0){
                respawn();
            }

            return;
        }

        updatePlayer();
        updateBarrels();
        updateCollisions();

        /*
           puntuación por tiempo
        */

        if(
            game.levelTimer%180===0 &&
            game.score>0
        ){

            game.score+=10;
        }
    }

    else if(game.state==="levelComplete"){

        game.deathTimer--;

        if(game.deathTimer<=0){

            nextLevel();
        }
    }
}

/* =========================================================
   GAME OVER
   ========================================================= */

        20,
        210,
        320,
        190
    );

    ctx.globalAlpha=1;

    ctx.strokeRect(
        20,
        210,
        320,

    );

    ctx.font="bold 27px monospace";

    ctx.fillText(
        "GAME OVER",

    );

    ctx.fillText(
        "SCORE",

        305
    );

/* =========================================================
   LEVEL COMPLETE
   ========================================================= */

function drawLevelComplete(){

    drawBackground();

    drawPlatforms();
    drawLadders();
    drawPrincess();
    drawKong();
    drawPlayer();

    ctx.fillStyle="#000";

    ctx.fillRect(
        35,
        255,
        290,
        110
    );

    ctx.strokeStyle="#ffd000";

    ctx.lineWidth=3;

    ctx.strokeRect(
        35,
        255,
        290,
        110
    );

    ctx.textAlign="center";

    ctx.fillStyle="#ffd000";

    ctx.font="bold 22px monospace";

    ctx.fillText(
        "STAGE CLEAR!",
        180,
        295
    );

    ctx.fillStyle="#fff";

    ctx.font="12px monospace";

    ctx.fillText(
        "BONUS",
        180,
        325
    );

    ctx.fillStyle="#00d0ff";

    ctx.font="bold 18px monospace";

    ctx.fillText(
        "+ "+(1000*game.level),
        180,
        350
    );

    ctx.textAlign="left";
}


/* =========================================================
   MAIN GAME DRAW
   ========================================================= */

function drawGame(){

    drawBackground();

    drawPlatforms();
    drawLadders();

    drawPrincess();
    drawKong();

    for(const b of barrels){
        drawBarrel(b);
    }

    drawPlayer();

    drawSparks();


    /*
       Flash de daño
    */

    if(game.flash>0){

        ctx.fillStyle=
            game.flash%2 ?
            "#fff" :
            "#f00";

        ctx.globalAlpha=.25;

        ctx.fillRect(
            0,
            0,
            360,
            640
        );

        ctx.globalAlpha=1;
    }
}


/* =========================================================
   START
   ========================================================= */

function startGame(){

    audioStart();

    game.state="playing";

    game.score=0;
    game.lives=3;
    game.level=1;
    game.deathTimer=0;

    createLevel(1);

    document.getElementById("startTouch").style.display="none";
}


/* =========================================================
   HIGH SCORE
   ========================================================= */

function saveHighScore(){

    if(game.score>game.high){

        game.high=game.score;

        localStorage.setItem(
            "kongHighScore",
            String(game.high)
        );
    }
}


/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        360,
        640
    );

    if(game.state==="title"){

        drawTitle();

    }else if(game.state==="playing"){

        drawGame();

    }else if(game.state==="levelComplete"){

        drawLevelComplete();

    }else if(game.state==="gameover"){

        drawGameOver();

    }else if(game.state==="win"){

        drawWin();
    }
}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}


/* =========================================================
   INITIALIZATION
   ========================================================= */

createLevel(1);

loop();


/*
   Primera interacción:
   cualquier toque activa audio y empieza si
   estamos en pantalla de título.
*/

document.addEventListener(
    "touchstart",
    e=>{

        audioStart();

        if(
            game.state==="title" &&
            !e.target.classList.contains("control")
        ){

            startGame();
        }
    },
    {
        passive:true
    }
);


/*
   Mostrar botón táctil en móvil
*/

if(
    /iPhone|iPad|iPod|Android/i.test(
        navigator.userAgent
    )
){

    document.getElementById(
        "startTouch"
    ).style.display="block";
}
