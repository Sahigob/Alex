<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<meta name="theme-color" content="#090909">

<title>JUNGLE KONG · ARCADE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#gameShell{
    position:relative;
    width:100%;
    max-width:520px;
    height:100dvh;
    background:#000;
    overflow:hidden;
    box-shadow:
        0 0 0 4px #252525,
        0 0 30px rgba(0,0,0,.8);
}

canvas{
    display:block;
    width:100%;
    height:calc(100% - 125px);
    background:#000;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

/* =========================================================
   CONTROLES
========================================================= */

#touchControls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:125px;
    background:
        linear-gradient(
            #151515,
            #090909
        );
    border-top:4px solid #303030;
    box-shadow:0 -5px 15px rgba(0,0,0,.8);
    z-index:20;
}

.control{
    position:absolute;
    border:3px solid #555;
    background:
        linear-gradient(
            #383838,
            #1b1b1b
        );
    color:#fff;
    border-radius:10px;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    font-size:24px;
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.12),
        0 4px 0 #050505;
    touch-action:none;
}

.control:active,
.control.active{
    transform:translateY(3px);
    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.05),
        0 1px 0 #050505;
    background:#252525;
}

#left{
    left:3%;
    bottom:35px;
    width:14%;
    min-width:52px;
    height:55px;
}

#right{
    left:18%;
    bottom:35px;
    width:14%;
    min-width:52px;
    height:55px;
}

#up{
    left:33%;
    bottom:64px;
    width:13%;
    min-width:48px;
    height:45px;
    font-size:20px;
}

#down{
    left:33%;
    bottom:13px;
    width:13%;
    min-width:48px;
    height:45px;
    font-size:20px;
}

#jump{
    right:18%;
    bottom:29px;
    width:21%;
    min-width:78px;
    height:61px;
    font-size:15px;
}

#hammer{
    right:3%;
    bottom:29px;
    width:13%;
    min-width:55px;
    height:61px;
    font-size:25px;
}

#startTouch{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:140px;
    z-index:30;
    padding:15px 28px;
    border:3px solid #d7b347;
    border-radius:8px;
    background:#171717;
    color:#ffe48a;
    font-size:18px;
    font-weight:bold;
    letter-spacing:1px;
    box-shadow:
        0 4px 0 #000,
        inset 0 1px 0 rgba(255,255,255,.15);
    display:none;
}

@media(max-width:700px){
    #startTouch{
        display:block;
    }
}

@media(min-width:701px){
    #startTouch{
        display:none!important;
    }
}
</style>
</head>

<body>

<div id="gameShell">

    <canvas id="game" width="360" height="515"></canvas>

    <button id="startTouch">PULSA PARA JUGAR</button>

    <div id="touchControls">

        <button class="control"
                id="left"
                aria-label="Izquierda">◀</button>

        <button class="control"
                id="right"
                aria-label="Derecha">▶</button>

        <button class="control"
                id="up"
                aria-label="Subir">▲</button>

        <button class="control"
                id="down"
                aria-label="Bajar">▼</button>

        <button class="control"
                id="jump"
                aria-label="Saltar">SALTO</button>

        <button class="control"
                id="hammer"
                aria-label="Martillo">🔨</button>

    </div>
</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

ctx.imageSmoothingEnabled = false;

/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

function initAudio(){
    if(!audioCtx){
        try{
            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }catch(e){}
    }

    if(audioCtx && audioCtx.state === "suspended"){
        audioCtx.resume().catch(()=>{});
    }
}

function beep(freq,duration,type="square",volume=.035){
    if(!audioCtx) return;

    try{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.value = volume;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime + duration
        );

        osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
}

/* =========================================================
   INPUT
========================================================= */

const keys = {
    left:false,
    right:false,
    up:false,
    down:false,
    jump:false,
    hammer:false
};

let jumpPressed = false;
let hammerPressed = false;

function pressKey(name){
    if(!keys[name]){
        if(name === "jump") jumpPressed = true;
        if(name === "hammer") hammerPressed = true;
    }

    keys[name] = true;
}

function releaseKey(name){
    keys[name] = false;
}

/* =========================================================
   TOUCH
========================================================= */

function bindButton(id,name){
    const el = document.getElementById(id);

    const down = e =>{
        e.preventDefault();
        initAudio();

        el.classList.add("active");
        pressKey(name);
    };

    const up = e =>{
        e.preventDefault();

        el.classList.remove("active");
        releaseKey(name);
    };

    el.addEventListener("pointerdown",down);
    el.addEventListener("pointerup",up);
    el.addEventListener("pointercancel",up);
    el.addEventListener("pointerleave",up);
}

bindButton("left","left");
bindButton("right","right");
bindButton("up","up");
bindButton("down","down");
bindButton("jump","jump");
bindButton("hammer","hammer");

/* =========================================================
   TECLADO
========================================================= */

window.addEventListener("keydown",e=>{

    initAudio();

    if(
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight" ||
        e.code === "ArrowUp" ||
        e.code === "ArrowDown" ||
        e.code === "Space"
    ){
        e.preventDefault();
    }

    if(e.code === "ArrowLeft"){
        pressKey("left");
    }

    if(e.code === "ArrowRight"){
        pressKey("right");
    }

    if(e.code === "ArrowUp"){
        pressKey("up");
    }

    if(e.code === "ArrowDown"){
        pressKey("down");
    }

    if(e.code === "Space"){
        pressKey("jump");
    }

    if(e.code === "KeyZ" || e.code === "KeyX"){
        pressKey("hammer");
    }
});

window.addEventListener("keyup",e=>{

    if(e.code === "ArrowLeft"){
        releaseKey("left");
    }

    if(e.code === "ArrowRight"){
        releaseKey("right");
    }

    if(e.code === "ArrowUp"){
        releaseKey("up");
    }

    if(e.code === "ArrowDown"){
        releaseKey("down");
    }

    if(e.code === "Space"){
        releaseKey("jump");
    }

    if(e.code === "KeyZ" || e.code === "KeyX"){
        releaseKey("hammer");
    }
});

/* =========================================================
   ESTADOS
========================================================= */

const STATE = {
    TITLE:0,
    PLAYING:1,
    LEVEL_COMPLETE:2,
    GAMEOVER:3,
    WIN:4
};

let state = STATE.TITLE;

let score = 0;
let highScore = Number(
    localStorage.getItem("jungleKongHighScore") || 0
);

let lives = 3;
let level = 1;

let frame = 0;

/* =========================================================
   NIVEL
========================================================= */

let platforms = [];
let ladders = [];
let barrels = [];

let levelTimer = 0;
let nextBarrelTimer = 100;

/*
    IMPORTANTE:

    platformIndex:
      0 = plataforma inferior
      1 = siguiente plataforma
      2 = siguiente...
    
    El jugador SOLO puede aterrizar:
      - en su plataforma actual
      - en plataformas inferiores

    NUNCA en una plataforma superior.

    Para subir:
      exclusivamente mediante escalera.
*/

const LEVELS = [

    {
        platforms:[
            {x:8,y:455,w:344,tilt:0},
            {x:25,y:395,w:305,tilt:-.045},
            {x:8,y:335,w:320,tilt:.045},
            {x:30,y:275,w:320,tilt:-.045},
            {x:8,y:215,w:320,tilt:.045},
            {x:28,y:155,w:320,tilt:-.045},
            {x:8,y:95,w:325,tilt:.045}
        ],

        ladders:[
            {x:285,y:395,h:60},
            {x:48,y:335,h:60},
            {x:275,y:275,h:60},
            {x:55,y:215,h:60},
            {x:280,y:155,h:60},
            {x:85,y:95,h:60}
        ],

        kongX:258,
        kongY:48
    },

    {
        platforms:[
            {x:8,y:455,w:344,tilt:0},
            {x:22,y:395,w:310,tilt:.055},
            {x:8,y:335,w:320,tilt:-.055},
            {x:30,y:275,w:320,tilt:.055},
            {x:8,y:215,w:320,tilt:-.055},
            {x:25,y:155,w:325,tilt:.055},
            {x:8,y:95,w:330,tilt:-.055}
        ],

        ladders:[
            {x:60,y:395,h:60},
            {x:275,y:335,h:60},
            {x:60,y:275,h:60},
            {x:275,y:215,h:60},
            {x:70,y:155,h:60},
            {x:285,y:95,h:60}
        ],

        kongX:250,
        kongY:48
    },

    {
        platforms:[
            {x:8,y:455,w:344,tilt:0},
            {x:28,y:395,w:305,tilt:-.065},
            {x:8,y:335,w:320,tilt:.065},
            {x:30,y:275,w:320,tilt:-.065},
            {x:8,y:215,w:320,tilt:.065},
            {x:28,y:155,w:320,tilt:-.065},
            {x:8,y:95,w:325,tilt:.065}
        ],

        ladders:[
            {x:280,y:395,h:60},
            {x:50,y:335,h:60},
            {x:275,y:275,h:60},
            {x:55,y:215,h:60},
            {x:280,y:155,h:60},
            {x:75,y:95,h:60}
        ],

        kongX:245,
        kongY:48
    },

    {
        platforms:[
            {x:8,y:455,w:344,tilt:0},
            {x:20,y:395,w:315,tilt:.075},
            {x:8,y:335,w:320,tilt:-.075},
            {x:25,y:275,w:325,tilt:.075},
            {x:8,y:215,w:320,tilt:-.075},
            {x:25,y:155,w:325,tilt:.075},
            {x:8,y:95,w:330,tilt:-.075}
        ],

        ladders:[
            {x:65,y:395,h:60},
            {x:270,y:335,h:60},
            {x:60,y:275,h:60},
            {x:275,y:215,h:60},
            {x:70,y:155,h:60},
            {x:285,y:95,h:60}
        ],

        kongX:250,
        kongY:48
    }
];

/* =========================================================
   JUGADOR
========================================================= */

let player = {
    x:38,
    y:430,
    w:18,
    h:25,

    vx:0,
    vy:0,

    speed:1.65,
    jump:-7.4,

    grounded:true,

    platformIndex:0,

    onLadder:false,
    ladderIndex:-1,

    facing:1,

    anim:0,

    hammer:0,
    hammerTimer:0,

    invincible:0
};

/* =========================================================
   KONG / PRINCESA
========================================================= */

let kong = {
    x:250,
    y:48
};

let princess = {
    x:55,
    y:65
};

/* =========================================================
   UTILIDADES
========================================================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function rectsOverlap(a,b){
    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );
}

function platformYAt(p,x){
    const center = p.x + p.w/2;

    const normalized =
        (x-center)/(p.w/2);

    return p.y + normalized * p.tilt * p.w;
}

/* =========================================================
   CREAR NIVEL
========================================================= */

function createLevel(){

    const data = LEVELS[level-1];

    platforms = data.platforms.map(p=>({...p}));
    ladders = data.ladders.map(l=>({...l}));

    kong.x = data.kongX;
    kong.y = data.kongY;

    princess.x = level % 2 === 0 ? 275 : 55;
    princess.y = 62;

    barrels = [];

    levelTimer = 0;

    nextBarrelTimer =
        level === 1
            ? 105
            : 85;

    player.x = 38;
    player.platformIndex = 0;

    const bottom = platforms[0];

    player.y =
        platformYAt(
            bottom,
            player.x + player.w/2
        ) - player.h;

    player.vx = 0;
    player.vy = 0;

    player.grounded = true;
    player.onLadder = false;
    player.ladderIndex = -1;

    player.hammer = 0;
    player.hammerTimer = 0;
    player.invincible = 90;

    jumpPressed = false;
    hammerPressed = false;
}

/* =========================================================
   INICIAR
========================================================= */

function startGame(){

    initAudio();

    score = 0;
    lives = 3;
    level = 1;

    state = STATE.PLAYING;

    createLevel();

    beep(440,.08);
    setTimeout(()=>beep(660,.1),100);
}

function nextLevel(){

    if(level >= LEVELS.length){

        state = STATE.WIN;

        if(score > highScore){
            highScore = score;
            localStorage.setItem(
                "jungleKongHighScore",
                highScore
            );
        }

        return;
    }

    level++;

    state = STATE.PLAYING;

    createLevel();

    beep(523,.1);
    setTimeout(()=>beep(784,.12),100);
}

/* =========================================================
   REINICIAR TRAS MORIR
========================================================= */

function loseLife(){

    if(player.invincible > 0) return;

    lives--;

    beep(110,.25,"sawtooth",.045);

    if(lives <= 0){

        state = STATE.GAMEOVER;

        if(score > highScore){
            highScore = score;

            localStorage.setItem(
                "jungleKongHighScore",
                highScore
            );
        }

        return;
    }

    createLevel();
}

/* =========================================================
   ESCALERAS
========================================================= */

/*
    Cada escalera conecta:

       plataforma i
              |
              |
       plataforma i+1

    ladder[i]

    La parte inferior está en:
       ladder.y + ladder.h

    La parte superior está en:
       ladder.y
*/

function getLadderAtBottom(){

    if(
        player.platformIndex < 0 ||
        player.platformIndex >= ladders.length
    ){
        return null;
    }

    const l = ladders[player.platformIndex];

    const playerCenter =
        player.x + player.w/2;

    const ladderCenter =
        l.x + 9;

    const feet =
        player.y + player.h;

    const bottomY =
        l.y + l.h;

    if(
        Math.abs(playerCenter-ladderCenter) < 18 &&
        Math.abs(feet-bottomY) < 13
    ){
        return l;
    }

    return null;
}

function getLadderAtTop(){

    if(player.platformIndex <= 0){
        return null;
    }

    const index =
        player.platformIndex - 1;

    const l = ladders[index];

    const playerCenter =
        player.x + player.w/2;

    const ladderCenter =
        l.x + 9;

    const feet =
        player.y + player.h;

    const topY =
        l.y;

    if(
        Math.abs(playerCenter-ladderCenter) < 18 &&
        Math.abs(feet-topY) < 13
    ){
        return l;
    }

    return null;
}

function alignToLadder(l){

    player.x =
        l.x + 9 - player.w/2;

    player.vx = 0;
}

/* =========================================================
   INICIAR SUBIDA
========================================================= */

function tryStartClimbing(){

    if(player.onLadder) return true;

    /*
       SUBIR
    */

    if(keys.up){

        const bottomLadder =
            getLadderAtBottom();

        if(bottomLadder){

            player.onLadder = true;

            player.ladderIndex =
                player.platformIndex;

            alignToLadder(bottomLadder);

            player.y =
                bottomLadder.y +
                bottomLadder.h -
                player.h;

            player.vy = 0;
            player.grounded = false;

            beep(300,.04);

            return true;
        }
    }

    /*
       BAJAR
    */

    if(keys.down){

        const topLadder =
            getLadderAtTop();

        if(topLadder){

            player.onLadder = true;

            player.ladderIndex =
                player.platformIndex - 1;

            alignToLadder(topLadder);

            player.y =
                topLadder.y -
                player.h;

            player.vy = 0;
            player.grounded = false;

            beep(280,.04);

            return true;
        }
    }

    return false;
}

/* =========================================================
   ACTUALIZAR ESCALERA
========================================================= */

function updateLadder(){

    if(!player.onLadder) return false;

    const l =
        ladders[player.ladderIndex];

    if(!l){

        player.onLadder = false;
        return false;
    }

    alignToLadder(l);

    const topY =
        l.y - player.h;

    const bottomY =
        l.y + l.h - player.h;

    if(keys.up){

        player.y -= 1.55;

        player.y =
            Math.max(topY,player.y);
    }

    if(keys.down){

        player.y += 1.55;

        player.y =
            Math.min(bottomY,player.y);
    }

    player.vy = 0;

    /*
       LLEGÓ ARRIBA
    */

    if(player.y <= topY){

        player.y = topY;

        player.onLadder = false;

        player.platformIndex =
            player.ladderIndex + 1;

        player.grounded = true;

        beep(390,.05);

        return true;
    }

    /*
       LLEGÓ ABAJO
    */

    if(player.y >= bottomY){

        player.y = bottomY;

        player.onLadder = false;

        player.platformIndex =
            player.ladderIndex;

        player.grounded = true;

        beep(260,.05);

        return true;
    }

    return true;
}

/* =========================================================
   SALTO
========================================================= */

function tryJump(){

    if(!jumpPressed) return;

    jumpPressed = false;

    if(state !== STATE.PLAYING) return;

    if(player.onLadder) return;

    if(player.grounded){

        player.vy = player.jump;

        player.grounded = false;

        beep(220,.07);

    }
}

/* =========================================================
   PLATAFORMA SOBRE LA QUE PUEDE CAER
========================================================= */

/*
    ESTA ES UNA DE LAS CORRECCIONES IMPORTANTES.

    Si estamos en plataforma 2:

      puede caer a 2
      puede caer a 1
      puede caer a 0

      NO puede caer a 3, 4, 5...

    Por tanto un salto nunca permite atravesar
    la lógica de las escaleras.
*/

function getLandingPlatform(){

    const cx =
        player.x + player.w/2;

    const feet =
        player.y + player.h;

    let best = null;
    let bestIndex = -1;

    for(let i=0;i<platforms.length;i++){

        /*
           No se permite aterrizar
           sobre una plataforma superior.
        */

        if(i > player.platformIndex){
            continue;
        }

        const p = platforms[i];

        if(
            cx < p.x-2 ||
            cx > p.x+p.w+2
        ){
            continue;
        }

        const py =
            platformYAt(p,cx);

        /*
           Solo si estamos cayendo
           hacia la superficie.
        */

        if(
            feet >= py-2 &&
            feet <= py+13
        ){

            if(
                best === null ||
                py < best.y
            ){
                best = {
                    platform:p,
                    y:py,
                    index:i
                };

                bestIndex=i;
            }
        }
    }

    if(best){

        best.index = bestIndex;

        return best;
    }

    return null;
}

/* =========================================================
   ACTUALIZAR JUGADOR
========================================================= */

function updatePlayer(){

    if(player.invincible > 0){
        player.invincible--;
    }

    /*
       SI ESTÁ EN ESCALERA
    */

    if(player.onLadder){

        updateLadder();

        return;
    }

    /*
       Intentar empezar escalera
    */

    tryStartClimbing();

    if(player.onLadder){

        updateLadder();

        return;
    }

    /*
       MOVIMIENTO HORIZONTAL
    */

    player.vx = 0;

    if(keys.left){

        player.vx = -player.speed;
        player.facing = -1;

    }else if(keys.right){

        player.vx = player.speed;
        player.facing = 1;
    }

    player.x += player.vx;

    /*
       Límites
    */

    player.x =
        clamp(
            player.x,
            5,
            W-player.w-5
        );

    /*
       SALTO
    */

    tryJump();

    /*
       GRAVEDAD
    */

    player.vy += .31;

    if(player.vy > 7){
        player.vy = 7;
    }

    const oldY = player.y;

    player.y += player.vy;

    /*
       ATERRIZAJE

       Solo en plataforma actual
       o inferior.
    */

    if(player.vy >= 0){

        const landing =
            getLandingPlatform();

        if(landing){

            player.y =
                landing.y -
                player.h;

            player.vy = 0;

            player.grounded = true;

            /*
               Si ha caído a una plataforma inferior,
               actualizamos la plataforma actual.
            */

            if(
                landing.index <
                player.platformIndex
            ){

                player.platformIndex =
                    landing.index;

                score += 50;
            }

        }else{

            player.grounded = false;
        }

    }else{

        player.grounded = false;
    }

    /*
       Caída fuera del escenario
    */

    if(player.y > H+30){

        loseLife();
    }

    /*
       Animación
    */

    if(Math.abs(player.vx) > .1){
        player.anim += .2;
    }
}

/* =========================================================
   BARRILES
========================================================= */

function spawnBarrel(){

    const maxBarrels =
        level === 1 ? 3 : 4;

    if(barrels.length >= maxBarrels){
        return;
    }

    /*
       Evitar que nazcan amontonados
    */

    for(const b of barrels){

        if(
            Math.abs(b.x-kong.x) < 45 &&
            Math.abs(b.y-kong.y) < 35
        ){
            return;
        }
    }

    const direction =
        Math.random() < .5
            ? -1
            : 1;

    barrels.push({

        x:kong.x+15,
        y:kong.y+32,

        w:13,
        h:13,

        vx:
            direction *
            (1.05 + level*.06),

        vy:0,

        rotation:0,

        platformIndex:
            platforms.length-1,

        life:0
    });

    beep(120,.04);
}

/* =========================================================
   PLATAFORMA DEL BARRIL
========================================================= */

function getBarrelPlatform(b){

    const cx =
        b.x + b.w/2;

    const bottom =
        b.y + b.h;

    let best = null;
    let bestIndex = -1;

    for(let i=0;i<platforms.length;i++){

        const p = platforms[i];

        if(
            cx < p.x ||
            cx > p.x+p.w
        ){
            continue;
        }

        const py =
            platformYAt(p,cx);

        if(
            bottom >= py-3 &&
            bottom <= py+12 &&
            b.vy >= 0
        ){

            if(
                best === null ||
                py < best
            ){

                best = py;
                bestIndex = i;
            }
        }
    }

    if(best !== null){

        return {
            y:best,
            index:bestIndex
        };
    }

    return null;
}

/* =========================================================
   ACTUALIZAR BARRILES
========================================================= */

function updateBarrels(){

    levelTimer++;

    /*
       Aparición controlada.

       No usamos una probabilidad por frame,
       porque eso puede producir demasiados barriles.
    */

    nextBarrelTimer--;

    if(nextBarrelTimer <= 0){

        spawnBarrel();

        nextBarrelTimer =
            95 +
            Math.floor(
                Math.random()*55
            );

        /*
           En niveles superiores,
           un poco más frecuentes.
        */

        if(level >= 3){
            nextBarrelTimer -= 10;
        }
    }

    for(let i=barrels.length-1;i>=0;i--){

        const b = barrels[i];

        b.life++;

        b.vy += .28;

        if(b.vy > 6){
            b.vy = 6;
        }

        b.x += b.vx;
        b.y += b.vy;

        b.rotation +=
            b.vx*.15;

        /*
           Plataforma
        */

        const p =
            getBarrelPlatform(b);

        if(p){

            b.y =
                p.y -
                b.h;

            b.vy = 0;

            b.platformIndex =
                p.index;

            /*
               El barril sigue la pendiente.
            */

            const platform =
                platforms[p.index];

            const slope =
                platform.tilt;

            if(Math.abs(slope) > .01){

                b.vx =
                    Math.abs(b.vx) *
                    (slope > 0 ? 1 : -1);
            }

        }

        /*
           Bordes

           Si el barril sale de una plataforma
           puede caer y seguir avanzando.
        */

        if(
            b.x < -40 ||
            b.x > W+40 ||
            b.y > H+50
        ){

            barrels.splice(i,1);

            score += 10;

            continue;
        }

        /*
           Colisión con jugador
        */

        const hitBox = {
            x:b.x+2,
            y:b.y+2,
            w:b.w-4,
            h:b.h-4
        };

        if(
            player.invincible <= 0 &&
            rectsOverlap(player,hitBox)
        ){

            /*
               Si lleva martillo,
               puede destruir el barril.
            */

            if(player.hammer > 0){

                barrels.splice(i,1);

                score += 500;

                beep(180,.06);
                setTimeout(
                    ()=>beep(360,.08),
                    50
                );

                continue;

            }else{

                loseLife();

                return;
            }
        }
    }
}

/* =========================================================
   MARTILLO
========================================================= */

function activateHammer(){

    if(!hammerPressed){
        return;
    }

    hammerPressed = false;

    if(state !== STATE.PLAYING){
        return;
    }

    if(player.hammer <= 0){

        player.hammer = 1;
        player.hammerTimer = 360;

        beep(150,.08);
        setTimeout(
            ()=>beep(250,.08),
            70
        );
    }
}

function updateHammer(){

    if(player.hammer <= 0){
        return;
    }

    player.hammerTimer--;

    if(player.hammerTimer <= 0){

        player.hammer = 0;
        player.hammerTimer = 0;
    }

    /*
       Golpe del martillo

       Área delante del personaje.
    */

    const hit = {

        x:
            player.facing > 0
                ? player.x+player.w
                : player.x-28,

        y:
            player.y-5,

        w:28,
        h:34
    };

    for(let i=barrels.length-1;i>=0;i--){

        if(
            rectsOverlap(
                hit,
                barrels[i]
            )
        ){

            barrels.splice(i,1);

            score += 500;

            beep(170,.05);
            setTimeout(
                ()=>beep(330,.08),
                45
            );
        }
    }
}

/* =========================================================
   META
========================================================= */

function checkGoal(){

    if(
        player.platformIndex >=
        platforms.length-1
    ){

        const goal = {
            x:princess.x-12,
            y:princess.y-5,
            w:35,
            h:35
        };

        if(rectsOverlap(player,goal)){

            score += 1000;

            beep(523,.1);

            setTimeout(
                ()=>beep(659,.1),
                100
            );

            setTimeout(
                ()=>beep(784,.18),
                200
            );

            state =
                level >= LEVELS.length
                    ? STATE.WIN
                    : STATE.LEVEL_COMPLETE;
        }
    }
}

/* =========================================================
   ACTUALIZACIÓN GENERAL
========================================================= */

function update(){

    frame++;

    if(state !== STATE.PLAYING){
        return;
    }

    updatePlayer();

    if(state !== STATE.PLAYING){
        return;
    }

    activateHammer();

    updateHammer();

    updateBarrels();

    checkGoal();

    if(score > highScore){
        highScore = score;

        localStorage.setItem(
            "jungleKongHighScore",
            highScore
        );
    }
}

/* =========================================================
   PLATAFORMAS
========================================================= */

function drawPlatforms(){

    for(const p of platforms){

        ctx.save();

        ctx.strokeStyle="#b51c24";
        ctx.lineWidth=5;

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y +
            (0-p.x) *
            p.tilt
        );

        ctx.lineTo(
            p.x+p.w,
            p.y +
            p.w *
            p.tilt
        );

        ctx.stroke();

        /*
           Borde amarillo clásico
        */

        ctx.strokeStyle="#e0b52d";
        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y-3 +
            (0-p.x) *
            p.tilt
        );

        ctx.lineTo(
            p.x+p.w,
            p.y-3 +
            p.w *
            p.tilt
        );

        ctx.stroke();

        /*
           Remaches
        */

        ctx.fillStyle="#ddd";

        for(
            let x=p.x+8;
            x<p.x+p.w;
            x+=24
        ){

            const yy =
                p.y +
                (x-p.x)*
                p.tilt;

            ctx.fillRect(
                Math.round(x),
                Math.round(yy-1),
                2,
                2
            );
        }

        ctx.restore();
    }
}

/* =========================================================
   ESCALERAS
========================================================= */

function drawLadders(){

    for(const l of ladders){

        ctx.save();

        /*

        ctx.strokeStyle="#d6a63a";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(
            l.x,
            l.y
        );

        ctx.lineTo(
            l.x,
            l.y+l.h
        );

        ctx.moveTo(
            l.x+18,
            l.y
        );

        ctx.lineTo(
            l.x+18,
            l.y+l.h
        );

        ctx.stroke();

        /*
           Peldaños
        */

        ctx.strokeStyle="#f0ca5c";
        ctx.lineWidth=2;

        for(
            let y=l.y+7;
            y<l.y+l.h;
            y+=10
        ){

            ctx.beginPath();

            ctx.moveTo(
                l.x,
                y
            );

            ctx.lineTo(
                l.x+18,
                y
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}

            "center"
        );
    }
}

/* =========================================================
   VICTORIA
========================================================= */

function drawWin(){

    clear();

    ctx.fillStyle="#151515";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    text(
        "¡¡¡VICTORIA!!!",
        W/2,
        150,
        25,
        "center"
    );

    text(
        "HAS SALVADO A LA PRINCESA",
        W/2,
        200,
        10,
        "center"
    );

    text(
        "PUNTUACIÓN",
        W/2,
        250,
        9,
        "center"
    );

    text(
        String(score),
        W/2,
        275,
        22,
        "center"
    );

    text(
        "HI-SCORE " +
        String(highScore).padStart(6,"0"),
        W/2,
        315,
        10,
        "center"
    );

    if(
        Math.floor(frame/30)%2===0
    ){

        text(
            "PULSA PARA VOLVER A JUGAR",
            W/2,
            370,
            10,
            "center"
        );
    }
}

/* =========================================================
   DIBUJAR
========================================================= */

function draw(){

    if(state === STATE.TITLE){

        drawTitle();

    }else if(state === STATE.PLAYING){

        drawWorld();

    }else if(state === STATE.LEVEL_COMPLETE){

        drawLevelComplete();

    }else if(state === STATE.GAMEOVER){

        drawGameOver();

    }else if(state === STATE.WIN){

        drawWin();
    }
}

/* =========================================================
   CLICK / TOUCH PARA START
========================================================= */

function actionStart(){

    initAudio();

    if(state === STATE.TITLE){

        startGame();

    }else if(state === STATE.LEVEL_COMPLETE){

        nextLevel();

    }else if(
        state === STATE.GAMEOVER ||
        state === STATE.WIN
    ){

        startGame();
    }
}

document
    .getElementById("startTouch")
    .addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            actionStart();
        }
    );

canvas.addEventListener(
    "pointerdown",
    e=>{

        initAudio();

        if(state !== STATE.PLAYING){
            actionStart();
        }
    }
);

/*
   También permite iniciar desde teclado.
*/

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.code === "Enter" ||
            e.code === "Space"
        ){

            if(state !== STATE.PLAYING){

                e.preventDefault();

                actionStart();
            }
        }
    }
);

/* =========================================================
   PAUSA AL SALIR DE LA PÁGINA
========================================================= */

let paused = false;

document.addEventListener(
    "visibilitychange",
    ()=>{

        paused =
            document.hidden;
    }
);

/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

    if(!paused){

        update();
        draw();
    }

    requestAnimationFrame(loop);
}

/* =========================================================
   ARRANQUE
========================================================= */

createLevel();

loop();

</script>

</html>
