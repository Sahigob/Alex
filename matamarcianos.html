<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050712">

<title>Marcianitos</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030a;
    color:#fff;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

#gameWrap{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(100vh,177.777vw);
    max-width:430px;
    max-height:760px;
    aspect-ratio:9 / 16;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 20%,#10172d 0%,#050712 38%,#02030a 100%);
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:
        max(14px,env(safe-area-inset-top))
        14px
        0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    pointer-events:none;
    z-index:10;
}

.stat{
    min-width:64px;
    text-align:center;
}

.statLabel{
    font-size:9px;
    font-weight:900;
    letter-spacing:1.5px;
    color:#69738d;
}

.statValue{
    margin-top:2px;
    font-size:18px;
    line-height:1;
    font-weight:900;
    color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,.15);
}

#pauseBtn{
    width:38px;
    height:38px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    background:rgba(10,12,24,.75);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    pointer-events:auto;
    touch-action:none;
    box-shadow:
        0 6px 20px rgba(0,0,0,.35),
        inset 0 0 0 1px rgba(255,255,255,.03);
}

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:
        0
        18px
        max(18px,env(safe-area-inset-bottom))
        18px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    z-index:20;
    pointer-events:none;
}

.controlSide{
    display:flex;
    gap:10px;
    pointer-events:auto;
}

.control{
    border:1px solid rgba(255,255,255,.12);
    background:
        linear-gradient(
            180deg,
            rgba(24,28,49,.95),
            rgba(9,11,22,.96)
        );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 8px 24px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.05);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.control.small{
    width:70px;
    height:58px;
    border-radius:18px;
    font-size:25px;
}

#fireButton{
    width:92px;
    height:92px;
    border-radius:50%;
    border-color:rgba(255,56,187,.35);
    background:
        radial-gradient(
            circle at 35% 28%,
            rgba(255,102,211,.95),
            rgba(194,25,142,.95) 55%,
            rgba(84,8,67,.98) 100%
        );
    box-shadow:
        0 10px 30px rgba(230,28,170,.25),
        inset 0 2px 4px rgba(255,255,255,.18);
    font-size:29px;
}

.control.active{
    transform:scale(.94);
    filter:brightness(1.25);
}

#overlay{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:rgba(1,2,8,.68);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

#overlay.show{
    display:flex;
}

.panel{
    width:min(100%,330px);
    padding:28px 24px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.12);
    background:
        linear-gradient(
            180deg,
            rgba(18,22,40,.98),
            rgba(6,8,17,.98)
        );
    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.04);
    text-align:center;
}

.eyebrow{
    color:#ff48bd;
    font-size:10px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:9px;
}

.title{
    margin:0;
    font-size:40px;
    line-height:.95;
    font-weight:1000;
    letter-spacing:-2px;
    text-shadow:
        0 0 20px rgba(255,53,185,.22);
}

.subtitle{
    margin-top:10px;
    color:#7e88a2;
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
}

.menuText{
    margin:20px 0;
    color:#aeb6cb;
    font-size:13px;
    line-height:1.55;
}

.menuBtn{
    width:100%;
    height:52px;
    border:0;
    border-radius:15px;
    color:#fff;
    font-weight:900;
    font-size:14px;
    background:
        linear-gradient(
            135deg,
            #ff3db8,
            #a30c76
        );
    box-shadow:
        0 10px 28px rgba(221,24,163,.22);
    touch-action:manipulation;
}

.menuBtn.secondary{
    margin-top:10px;
    background:#151a2b;
    box-shadow:none;
    border:1px solid rgba(255,255,255,.08);
}

.instructions{
    text-align:left;
    margin:20px 0;
}

.instruction{
    display:flex;
    align-items:center;
    gap:12px;
    margin:11px 0;
    color:#c0c7d9;
    font-size:12px;
}

.instructionIcon{
    width:35px;
    height:35px;
    border-radius:11px;
    background:#11162a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    flex-shrink:0;
}

#landscape{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    background:#03040a;
}

.landscapeBox{
    max-width:320px;
}

.landscapeIcon{
    font-size:55px;
    margin-bottom:15px;
}

.landscapeTitle{
    font-size:24px;
    font-weight:1000;
}

.landscapeText{
    margin-top:10px;
    color:#8992aa;
    font-size:13px;
    line-height:1.5;
}

@media (orientation:landscape) and (max-height:600px){

    #landscape{
        display:flex;
    }

}

@media(max-width:380px){

    .control.small{
        width:64px;
        height:54px;
    }

    #fireButton{
        width:84px;
        height:84px;
    }

}

</style>
</head>

<body>

<div id="gameWrap">

<canvas id="gameCanvas" width="360" height="640"></canvas>

<div id="hud">

    <div class="stat">
        <div class="statLabel">PUNTOS</div>
        <div class="statValue" id="scoreValue">0</div>
    </div>

    <div class="stat">
        <div class="statLabel">RÉCORD</div>
        <div class="statValue" id="highValue">0</div>
    </div>

    <div class="stat">
        <div class="statLabel">NIVEL</div>
        <div class="statValue" id="levelValue">1</div>
    </div>

    <button id="pauseBtn">Ⅱ</button>

</div>

<div id="controls">

    <div class="controlSide">

        <button
            class="control small"
            id="leftButton"
            aria-label="Mover izquierda"
        >
            ◀
        </button>

        <button
            class="control small"
            id="rightButton"
            aria-label="Mover derecha"
        >
            ▶
        </button>

    </div>

    <button
        class="control"
        id="fireButton"
        aria-label="Disparar"
    >
        ●
    </button>

</div>

<div id="overlay">

    <div class="panel" id="panel">

        <div class="eyebrow">ARCADE • 198X</div>

        <h1 class="title">MARCIANITOS</h1>

        <div class="subtitle">
            DEFEND THE PLANET
        </div>

        <div class="menuText">
            Una invasión alienígena está descendiendo.
            Destruye las oleadas y sobrevive todo lo que puedas.
        </div>

        <button
            class="menuBtn"
            id="startBtn"
        >
            JUGAR
        </button>

        <button
            class="menuBtn secondary"
            id="instructionsBtn"
        >
            CÓMO JUGAR
        </button>

    </div>

</div>

<div id="landscape">

    <div class="landscapeBox">

        <div class="landscapeIcon">📱</div>

        <div class="landscapeTitle">
            Gira el iPhone
        </div>

        <div class="landscapeText">
            Este juego está diseñado para jugarse
            en posición vertical.
        </div>

    </div>

</div>

</div>

<script>

/* =========================================================
   MARCIANITOS
   ========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = 360;
const H = 640;

const scoreValue = document.getElementById("scoreValue");
const highValue = document.getElementById("highValue");
const levelValue = document.getElementById("levelValue");

const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");

const startBtn = document.getElementById("startBtn");
const instructionsBtn = document.getElementById("instructionsBtn");
const pauseBtn = document.getElementById("pauseBtn");

const leftButton = document.getElementById("leftButton");
const rightButton = document.getElementById("rightButton");
const fireButton = document.getElementById("fireButton");

/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx = null;

function startAudio(){

    if(!audioCtx){

        try{
            audioCtx =
                new (window.AudioContext ||
                     window.webkitAudioContext)();
        }catch(e){
            return;
        }
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume().catch(()=>{});
    }
}

function sound(
    frequency,
    duration = .08,
    type = "square",
    volume = .035
){

    if(!audioCtx){
        return;
    }

    try{

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = frequency;

        gain.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime + duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
            audioCtx.currentTime + duration
        );

    }catch(e){}

}

/* =========================================================
   INPUT
   ========================================================= */

const input = {
    left:false,
    right:false,
    fire:false
};

function setButtonState(button,state){

    button.classList.toggle(
        "active",
        state
    );

}

/*
   CONTROLES TÁCTILES ROBUSTOS PARA IPHONE

   No utilizamos pointer capture para los
   controles táctiles.

   Safari/iOS puede comportarse de forma
   diferente con pointer events según
   versión y modo web-app.

   Touch Events + mouse/pointer para escritorio.
*/

function bindHold(button,key){

    let pressed = false;

    function press(e){

        if(e){
            e.preventDefault();
        }

        if(pressed){
            return;
        }

        pressed = true;

        startAudio();

        input[key] = true;

        setButtonState(
            button,
            true
        );

    }

    function release(e){

        if(e){
            e.preventDefault();
        }

        pressed = false;

        input[key] = false;

        setButtonState(
            button,
            false
        );

    }

    /*
       iPhone / iPad
       -------------------------
       Safari recibe directamente
       touchstart/touchend.
    */

    button.addEventListener(
        "touchstart",
        press,
        {
            passive:false
        }
    );

    button.addEventListener(
        "touchend",
        release,
        {
            passive:false
        }
    );

    button.addEventListener(
        "touchcancel",
        release,
        {
            passive:false
        }
    );

    /*
       Ordenador / ratón
    */

    button.addEventListener(
        "mousedown",
        e => {

            if(e.button !== 0){
                return;
            }

            press(e);

        }
    );

    window.addEventListener(
        "mouseup",
        release
    );

    /*
       Pointer Events únicamente
       para dispositivos de ratón.

       Evitamos duplicar el toque
       en Safari/iPhone.
    */

    button.addEventListener(
        "pointerdown",
        e => {

            if(e.pointerType === "mouse"){
                press(e);
            }

        }
    );

    button.addEventListener(
        "pointerup",
        e => {

            if(e.pointerType === "mouse"){
                release(e);
            }

        }
    );

    button.addEventListener(
        "pointercancel",
        e => {

            if(e.pointerType === "mouse"){
                release(e);
            }

        }
    );

}

bindHold(
    leftButton,
    "left"
);

bindHold(
    rightButton,
    "right"
);

bindHold(
    fireButton,
    "fire"
);

/* =========================================================
   TECLADO
   ========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if(e.code === "ArrowLeft"){
            input.left = true;
        }

        if(e.code === "ArrowRight"){
            input.right = true;
        }

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){
            input.fire = true;
        }

        if(e.code === "Escape"){
            togglePause();
        }

    }
);

window.addEventListener(
    "keyup",
    e => {

        if(e.code === "ArrowLeft"){
            input.left = false;
        }

        if(e.code === "ArrowRight"){
            input.right = false;
        }

        if(
            e.code === "Space" ||
            e.code === "ArrowUp"
        ){
            input.fire = false;
        }

    }
);

/* =========================================================
   ESTADO DEL JUEGO
   ========================================================= */

let gameState = "menu";

let score = 0;

let highScore =
    Number(
        localStorage.getItem(
            "marcianitosHighScore"
        ) || 0
    );

let level = 1;

let lives = 3;

let combo = 0;

let comboTimer = 0;

let lastTime = 0;

let levelTimer = 0;

let fireCooldown = 0;

let enemyFireTimer = 1;

let formationDirection = 1;

let formationDrop = 0;

let stars = [];

let bullets = [];

let enemyBullets = [];

let enemies = [];

let particles = [];

let floatingTexts = [];

let barriers = [];

let powerups = [];

let ufo = null;

let divingEnemies = [];

let screenShake = 0;

/* =========================================================
   ESTRELLAS
   ========================================================= */

for(let i=0;i<90;i++){

    stars.push({

        x:Math.random()*W,

        y:Math.random()*H,

        size:
            Math.random()<.75
                ? 1
                : 1.8,

        speed:
            10 + Math.random()*35,

        alpha:
            .25 + Math.random()*.75

    });

}

/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x:W/2,

    y:H-112,

    w:34,

    h:25,

    speed:230,

    lives:3,

    rapid:0,

    spread:0,

    shield:0,

    blink:0,

    fireDelay:.23

};

/* =========================================================
   UTILS
   ========================================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(max,value)
    );

}

function rand(
    min,
    max
){

    return min +
        Math.random() *
        (max-min);

}

function rectsOverlap(a,b){

    return (
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );

}

function circleRect(
    c,
    r
){

    const closestX =
        clamp(
            c.x,
            r.x,
            r.x+r.w
        );

    const closestY =
        clamp(
            c.y,
            r.y,
            r.y+r.h
        );

    const dx =
        c.x-closestX;

    const dy =
        c.y-closestY;

    return (
        dx*dx +
        dy*dy <
        c.r*c.r
    );

}

/* =========================================================
   SCORE
   ========================================================= */

function addScore(value){

    const multiplier =
        1 + Math.min(
            combo * .15,
            2
        );

    const points =
        Math.round(
            value * multiplier
        );

    score += points;

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "marcianitosHighScore",
            highScore
        );

    }

    scoreValue.textContent = score;
    highValue.textContent = highScore;

}

/* =========================================================
   PARTICLES
   ========================================================= */

function burst(
    x,
    y,
    count=12,
    power=90
){

    for(let i=0;i<count;i++){

        const angle =
            Math.random() *
            Math.PI*2;

        const speed =
            Math.random() *
            power;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            life:
                .35 +
                Math.random()*.55,

            maxLife:
                .35 +
                Math.random()*.55,

            size:
                1+
                Math.random()*2.5

        });

    }

}

function addText(
    text,
    x,
    y,
    color="#fff"
){

    floatingTexts.push({

        text,
        x,
        y,
        color,
        life:1

    });

}

/* =========================================================
   CREATE ENEMIES
   ========================================================= */

function createFormation(){

    enemies = [];

    const rows =
        Math.min(
            4 + Math.floor(level/2),
            6
        );

    const cols = 7;

    const startX = 48;
    const startY = 92;

    for(let row=0;row<rows;row++){

        for(let col=0;col<cols;col++){

            let type = 0;

            if(row === 0){
                type = 2;
            }else if(row === 1){
                type = 1;
            }else{
                type = 0;
            }

            const hp =
                type === 2
                    ? 2 + Math.floor(level/4)
                    : type === 1
                        ? 2
                        : 1;

            enemies.push({

                x:
                    startX +
                    col*39,

                y:
                    startY +
                    row*30,

                w:26,

                h:20,

                row,

                col,

                type,

                hp,

                maxHp:hp,

                alive:true,

                phase:
                    Math.random()*Math.PI*2

            });

        }

    }

    formationDirection = 1;
    formationDrop = 0;

}

/* =========================================================
   BARRIERS
   ========================================================= */

function createBarriers(){

    barriers = [];

    const positions = [
        46,
        125,
        204,
        283
    ];

    positions.forEach(x => {

        const cells = [];

        for(let yy=0;yy<4;yy++){

            for(let xx=0;xx<7;xx++){

                if(
                    !(yy===3 && (xx===0 || xx===6)) &&
                    !(yy===0 && (xx===0 || xx===1 || xx===5 || xx===6))
                ){

                    cells.push({

                        x:x+xx*5,

                        y:H-180+yy*6,

                        w:5,

                        h:6,

                        hp:3

                    });

                }

            }

        }

        barriers.push(cells);

    });

}

/* =========================================================
   RESET GAME
   ========================================================= */

function resetGame(){

    score = 0;

    level = 1;

    lives = 3;

    combo = 0;

    comboTimer = 0;

    bullets = [];

    enemyBullets = [];

    particles = [];

    floatingTexts = [];

    powerups = [];

    divingEnemies = [];

    ufo = null;

    player.x = W/2;
    player.y = H-112;

    player.lives = 3;

    player.rapid = 0;
    player.spread = 0;
    player.shield = 0;

    player.blink = 0;

    player.fireDelay = .23;

    fireCooldown = 0;

    enemyFireTimer = 1;

    levelTimer = 0;

    createFormation();

    createBarriers();

    updateHUD();

}

/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

    scoreValue.textContent = score;

    highValue.textContent = highScore;

    levelValue.textContent = level;

}

/* =========================================================
   PLAYER FIRE
   ========================================================= */

function playerFire(){

    if(fireCooldown > 0){
        return;
    }

    fireCooldown =
        player.rapid > 0
            ? .105
            : player.fireDelay;

    const speed = -430;

    if(player.spread > 0){

        bullets.push({

            x:player.x,

            y:player.y-17,

            vx:0,

            vy:speed,

            w:4,

            h:14,

            damage:1

        });

        bullets.push({

            x:player.x,

            y:player.y-17,

            vx:-75,

            vy:speed,

            w:4,

            h:14,

            damage:1

        });

        bullets.push({

            x:player.x,

            y:player.y-17,

            vx:75,

            vy:speed,

            w:4,

            h:14,

            damage:1

        });

    }else{

        bullets.push({

            x:player.x,

            y:player.y-17,

            vx:0,

            vy:speed,

            w:4,

            h:14,

            damage:1

        });

    }

    sound(
        700,
        .045,
        "square",
        .025
    );

}

/* =========================================================
   ENEMY FIRE
   ========================================================= */

function enemyFire(){

    const alive =
        enemies.filter(
            e => e.alive
        );

    if(!alive.length){
        return;
    }

    const columns = {};

    alive.forEach(e => {

        if(
            !columns[e.col] ||
            e.y > columns[e.col].y
        ){

            columns[e.col] = e;

        }

    });

    const shooters =
        Object.values(columns);

    if(!shooters.length){
        return;
    }

    const enemy =
        shooters[
            Math.floor(
                Math.random()*shooters.length
            )
        ];

    enemyBullets.push({

        x:enemy.x+enemy.w/2,

        y:enemy.y+enemy.h,

        vx:rand(-18,18),

        vy:
            145 +
            level*8,

        r:3.5

    });

}

/* =========================================================
   POWERUPS
   ========================================================= */

function spawnPowerup(
    x,
    y
){

    const types = [
        "rapid",
        "spread",
        "shield",
        "life"
    ];

    const type =
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

    powerups.push({

        x,
        y,

        w:18,

        h:18,

        vy:65,

        type

    });

}

function collectPowerup(p){

    if(p.type === "rapid"){

        player.rapid = 8;

        addText(
            "RÁPIDO",
            player.x,
            player.y-25
        );

    }

    if(p.type === "spread"){

        player.spread = 10;

        addText(
            "TRIPLE",
            player.x,
            player.y-25
        );

    }

    if(p.type === "shield"){

        player.shield = 8;

        addText(
            "ESCUDO",
            player.x,
            player.y-25
        );

    }

    if(p.type === "life"){

        player.lives =
            Math.min(
                player.lives+1,
                5
            );

        lives = player.lives;

        addText(
            "+1 VIDA",
            player.x,
            player.y-25
        );

    }

    sound(
        850,
        .12,
        "sine",
        .04
    );

}

/* =========================================================
   UFO
   ========================================================= */

function maybeSpawnUFO(){

    if(ufo){
        return;
    }

    if(Math.random() < .0008){

        ufo = {

            x:-35,

            y:66,

            w:32,

            h:14,

            vx:75+level*4,

            hp:2,

            alive:true

        };

    }

}

/* =========================================================
   DIVING ENEMY
   ========================================================= */

function maybeDive(){

    if(
        divingEnemies.length >=
        Math.min(
            1+Math.floor(level/3),
            3
        )
    ){
        return;
    }

    if(Math.random() < .0025){

        const alive =
            enemies.filter(
                e =>
                    e.alive &&
                    e.row < 2
            );

        if(!alive.length){
            return;
        }

        const source =
            alive[
                Math.floor(
                    Math.random()*alive.length
                )
            ];

        divingEnemies.push({

            x:source.x,

            y:source.y,

            w:25,

            h:21,

            vx:
                (player.x-source.x)*.35,

            vy:95,

            life:4,

            phase:0

        });

    }

}

/* =========================================================
   DAMAGE PLAYER
   ========================================================= */

function hitPlayer(){

    if(player.blink > 0){
        return;
    }

    if(player.shield > 0){

        player.shield = 0;

        player.blink = 1;

        burst(
            player.x,
            player.y,
            18,
            130
        );

        sound(
            180,
            .18,
            "sawtooth",
            .04
        );

        return;

    }

    player.lives--;

    lives = player.lives;

    player.blink = 1.6;

    combo = 0;

    screenShake = .25;

    burst(
        player.x,
        player.y,
        25,
        160
    );

    sound(
        90,
        .25,
        "sawtooth",
        .06
    );

    if(player.lives <= 0){

        gameOver();

    }

}

    );

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

    if(gameState !== "playing"){
        return;
    }

    /* ---------------------------------
       PLAYER
    --------------------------------- */

    let movement = 0;

    if(input.left){
        movement -= 1;
    }

    if(input.right){
        movement += 1;
    }

    player.x +=
        movement *
        player.speed *
        dt;

    player.x =
        clamp(
            player.x,
            24,
            W-24
        );

    fireCooldown =
        Math.max(
            0,
            fireCooldown-dt
        );

    if(input.fire){
        playerFire();
    }

    if(player.rapid > 0){
        player.rapid -= dt;
    }

    if(player.spread > 0){
        player.spread -= dt;
    }

    if(player.shield > 0){
        player.shield -= dt;
    }

    if(player.blink > 0){
        player.blink -= dt;
    }

    /* ---------------------------------
       COMBO
    --------------------------------- */

    if(comboTimer > 0){

        comboTimer -= dt;

        if(comboTimer <= 0){
            combo = 0;
        }

    }

    /* ---------------------------------
       STARS
    --------------------------------- */

    stars.forEach(s => {

        s.y +=
            s.speed *
            dt;

        if(s.y > H){
            s.y = -3;
            s.x = Math.random()*W;
        }

    });

    /* ---------------------------------
       BULLETS
    --------------------------------- */

    bullets.forEach(b => {

        b.x += b.vx*dt;
        b.y += b.vy*dt;

    });

    bullets =
        bullets.filter(
            b =>
                b.y > -30 &&
                b.x > -20 &&
                b.x < W+20
        );

    /* ---------------------------------
       ENEMY BULLETS
    --------------------------------- */

    enemyBullets.forEach(b => {

        b.x += b.vx*dt;
        b.y += b.vy*dt;

    });

    enemyBullets =
        enemyBullets.filter(
            b =>
                b.y < H+20
        );

    /* ---------------------------------
       FORMATION
    --------------------------------- */

    const alive =
        enemies.filter(
            e => e.alive
        );

    if(alive.length){

        let minX = Infinity;
        let maxX = -Infinity;

        alive.forEach(e => {

            minX =
                Math.min(
                    minX,
                    e.x
                );

            maxX =
                Math.max(
                    maxX,
                    e.x+e.w
                );

        });

        const formationSpeed =
            18 +
            level*4;

        let dx =
            formationDirection *
            formationSpeed *
            dt;

        if(
            maxX+dx > W-18 ||
            minX+dx < 18
        ){

            formationDirection *= -1;

            formationDrop =
                Math.min(
                    formationDrop+9,
                    35
                );

        }

        enemies.forEach(e => {

            if(!e.alive){
                return;
            }

            e.x += dx;

            if(formationDrop > 0){
                e.y += formationDrop;
            }

            e.phase += dt*2;

        });

        formationDrop = 0;

    }

    /* ---------------------------------
       ENEMY FIRE
    --------------------------------- */

    enemyFireTimer -= dt;

    if(enemyFireTimer <= 0){

        enemyFire();

        enemyFireTimer =
            Math.max(
                .35,
                1.25 -
                level*.045
            ) +
            Math.random()*.6;

    }

    /* ---------------------------------
       DIVING ENEMIES
    --------------------------------- */

    maybeDive();

    divingEnemies.forEach(d => {

        const dx =
            player.x-d.x;

        d.vx +=
            dx *
            dt *
            .75;

        d.vx =
            clamp(
                d.vx,
                -120,
                120
            );

        d.x += d.vx*dt;

        d.y += d.vy*dt;

        d.phase += dt*7;

        d.life -= dt;

    });

    divingEnemies =
        divingEnemies.filter(
            d =>
                d.life > 0 &&
                d.y < H+40
        );

    /* ---------------------------------
       UFO
    --------------------------------- */

    maybeSpawnUFO();

    if(ufo){

        ufo.x +=
            ufo.vx *
            dt;

        if(ufo.x > W+40){
            ufo = null;
        }

    }

    /* ---------------------------------
       POWERUPS
    --------------------------------- */

    powerups.forEach(p => {

        p.y += p.vy*dt;

    });

    powerups =
        powerups.filter(
            p =>
                p.y < H+30
        );

    /* ---------------------------------
       PLAYER BULLETS vs ENEMIES
    --------------------------------- */

    for(let bi=bullets.length-1;bi>=0;bi--){

        const b = bullets[bi];

        let destroyed = false;

        for(let ei=enemies.length-1;ei>=0;ei--){

            const e = enemies[ei];

            if(!e.alive){
                continue;
            }

            if(rectsOverlap(
                b,
                e
            )){

                e.hp -= b.damage;

                bullets.splice(
                    bi,
                    1
                );

                destroyed = true;

                burst(
                    b.x,
                    b.y,
                    4,
                    45
                );

                if(e.hp <= 0){

                    e.alive = false;

                    combo++;

                    comboTimer = 2.3;

                    let points = 20;

                    if(e.type === 1){
                        points = 30;
                    }

                    if(e.type === 2){
                        points = 50;
                    }

                    addScore(
                        points
                    );

                    addText(
                        "+" + points,
                        e.x+e.w/2,
                        e.y,
                        "#ff54c2"
                    );

                    burst(
                        e.x+e.w/2,
                        e.y+e.h/2,
                        16,
                        110
                    );

                    sound(
                        e.type === 2
                            ? 170
                            : 250,
                        .09,
                        "square",
                        .04
                    );

                    if(
                        Math.random() <
                        .10
                    ){

                        spawnPowerup(
                            e.x+e.w/2,
                            e.y
                        );

                    }

                }else{

                    sound(
                        400,
                        .045,
                        "square",
                        .02
                    );

                }

                break;

            }

        }

        if(destroyed){
            continue;
        }

        /* bullet vs UFO */

        if(
            ufo &&
            rectsOverlap(
                b,
                ufo
            )
        ){

            bullets.splice(
                bi,
                1
            );

            ufo.hp--;

            burst(
                b.x,
                b.y,
                7,
                65
            );

            if(ufo.hp <= 0){

                addScore(
                    250 * level
                );

                addText(
                    "UFO +"+(250*level),
                    ufo.x,
                    ufo.y,
                    "#ffe95a"
                );

                burst(
                    ufo.x+ufo.w/2,
                    ufo.y+ufo.h/2,
                    28,
                    150
                );

                sound(
                    110,
                    .3,
                    "sawtooth",
                    .05
                );

                ufo = null;

            }

        }

    }

    /* ---------------------------------
       BULLETS vs DIVING ENEMIES
    --------------------------------- */

    for(let bi=bullets.length-1;bi>=0;bi--){

        const b = bullets[bi];

        let hit = false;

        for(let di=divingEnemies.length-1;di>=0;di--){

            const d =
                divingEnemies[di];

            if(rectsOverlap(
                b,
                d
            )){

                bullets.splice(
                    bi,
                    1
                );

                divingEnemies.splice(
                    di,
                    1
                );

                combo++;

                comboTimer = 2.3;

                addScore(70);

                addText(
                    "+70",
                    d.x,
                    d.y,
                    "#65f5ff"
                );

                burst(
                    d.x,
                    d.y,
                    18,
                    120
                );

                sound(
                    300,
                    .1,
                    "square",
                    .04
                );

                hit = true;

                break;

            }

        }

        if(hit){
            continue;
        }

    }

    /* ---------------------------------
       BULLETS vs BARRIERS
    --------------------------------- */

    for(let bi=bullets.length-1;bi>=0;bi--){

        const b = bullets[bi];

        let hit = false;

        for(const barrier of barriers){

            for(
                let ci=barrier.length-1;
                ci>=0;
                ci--
            ){

                const cell =
                    barrier[ci];

                if(
                    cell.hp > 0 &&
                    rectsOverlap(
                        b,
                        cell
                    )
                ){

                    cell.hp--;

                    bullets.splice(
                        bi,
                        1
                    );

                    burst(
                        b.x,
                        b.y,
                        3,
                        30
                    );

                    hit = true;

                    break;

                }

            }

            if(hit){
                break;
            }

        }

    }

    /* ---------------------------------
       ENEMY BULLETS vs BARRIERS
    --------------------------------- */

    for(
        let bi=enemyBullets.length-1;
        bi>=0;
        bi--
    ){

        const b =
            enemyBullets[bi];

        let hit = false;

        for(const barrier of barriers){

            for(
                let ci=barrier.length-1;
                ci>=0;
                ci--
            ){

                const cell =
                    barrier[ci];

                if(
                    cell.hp > 0 &&
                    circleRect(
                        b,
                        cell
                    )
                ){

                    cell.hp--;

                    enemyBullets.splice(
                        bi,
                        1
                    );

                    burst(
                        b.x,
                        b.y,
                        3,
                        25
                    );

                    hit = true;

                    break;

                }

            }

            if(hit){
                break;
            }

        }

        if(hit){
            continue;
        }

    }

    /* ---------------------------------
       ENEMY BULLETS vs PLAYER
    --------------------------------- */

    for(
        let bi=enemyBullets.length-1;
        bi>=0;
        bi--
    ){

        const b =
            enemyBullets[bi];

        if(
            circleRect(
                b,
                {
                    x:
                        player.x-
                        player.w/2,

                    y:
                        player.y-
                        player.h/2,

                    w:player.w,

                    h:player.h
                }
            )
        ){

            enemyBullets.splice(
                bi,
                1
            );

            hitPlayer();

        }

    }

    /* ---------------------------------
       DIVING vs PLAYER
    --------------------------------- */

    for(
        let i=divingEnemies.length-1;
        i>=0;
        i--
    ){

        const d =
            divingEnemies[i];

        if(
            rectsOverlap(
                d,
                {
                    x:
                        player.x-
                        player.w/2,

                    y:
                        player.y-
                        player.h/2,

                    w:player.w,

                    h:player.h

                }
            )
        ){

            divingEnemies.splice(
                i,
                1
            );

            hitPlayer();

        }

    }

    /* ---------------------------------
       ENEMIES REACH PLAYER
    --------------------------------- */

    for(const e of enemies){

        if(
            e.alive &&
            e.y+e.h >
            player.y-20
        ){

            hitPlayer();

            e.alive = false;

        }

    }

    /* ---------------------------------
       POWERUP COLLECTION
    --------------------------------- */

    for(
        let i=powerups.length-1;
        i>=0;
        i--
    ){

        const p =
            powerups[i];

        if(
            rectsOverlap(
                p,
                {
                    x:
                        player.x-
                        player.w/2,

                    y:
                        player.y-
                        player.h/2,

                    w:player.w,

                    h:player.h

                }
            )
        ){

            collectPowerup(p);

            powerups.splice(
                i,
                1
            );

        }

    }

    /* ---------------------------------
       PARTICLES
    --------------------------------- */

    particles.forEach(p => {

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vy += 80*dt;

        p.life -= dt;

    });

    particles =
        particles.filter(
            p =>
                p.life > 0
        );

    /* ---------------------------------
       FLOATING TEXT
    --------------------------------- */

    floatingTexts.forEach(t => {

        t.y -=
            25*dt;

        t.life -=
            dt;

    });

    floatingTexts =
        floatingTexts.filter(
            t =>
                t.life > 0
        );

    /* ---------------------------------
       SCREEN SHAKE
    --------------------------------- */

    if(screenShake > 0){
        screenShake -= dt;
    }

    /* ---------------------------------
       LEVEL
    --------------------------------- */

    if(
        enemies.every(
            e => !e.alive
        ) &&
        divingEnemies.length === 0
    ){

        nextLevel();

    }

    updateHUD();

}

/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#080c1b"
    );

    gradient.addColorStop(
        .55,
        "#040611"
    );

    gradient.addColorStop(
        1,
        "#02030a"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    stars.forEach(s => {

        ctx.globalAlpha =
            s.alpha;

        ctx.fillStyle =
            "#d9e8ff";

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );

    });

    ctx.globalAlpha = 1;

    /* horizon glow */

    const glow =
        ctx.createRadialGradient(
            W/2,
            H-120,
            10,
            W/2,
            H-120,
            220
        );

    glow.addColorStop(
        0,
        "rgba(48,87,180,.09)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle = glow;

    ctx.fillRect(
        0,
        H-300,
        W,
        300
    );

}

/* =========================================================
   DRAW PLAYER
   ========================================================= */

function drawPlayer(){

    if(
        player.blink > 0 &&
        Math.floor(
            player.blink*12
        )%2===0
    ){
        return;
    }

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    /* shield */

    if(player.shield > 0){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            28,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            "rgba(85,224,255,.75)";

        ctx.lineWidth = 2;

        ctx.shadowColor =
            "#4beaff";

        ctx.shadowBlur = 15;

        ctx.stroke();

    }

    /* glow */

    ctx.shadowColor =
        "#ff3db8";

    ctx.shadowBlur = 18;

    /* ship */

    ctx.fillStyle =
        "#f6f7ff";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -18
    );

    ctx.lineTo(
        18,
        12
    );

    ctx.lineTo(
        8,
        10
    );

    ctx.lineTo(
        4,
        17
    );

    ctx.lineTo(
        -4,
        17
    );

    ctx.lineTo(
        -8,
        10
    );

    ctx.lineTo(
        -18,
        12
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#ff3db8";

    ctx.fillRect(
        -5,
        2,
        10,
        7
    );

    ctx.fillStyle =
        "#68efff";

    ctx.beginPath();

    ctx.arc(
        0,
        -7,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* engine */

    ctx.fillStyle =
        "#ffb4e7";

    ctx.beginPath();

    ctx.moveTo(
        -6,
        13
    );

    ctx.lineTo(
        0,
        24 +
        Math.random()*5
    );

    ctx.lineTo(
        6,
        13
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}

/* =========================================================
   DRAW ENEMY
   ========================================================= */

function drawEnemy(e){

    if(!e.alive){
        return;
    }

    ctx.save();

    ctx.translate(
        e.x+e.w/2,
        e.y+e.h/2
    );

    const bob =
        Math.sin(
            e.phase
        )*1.3;

    ctx.translate(
        0,
        bob
    );

    let body =
        e.type === 2
            ? "#ff5dca"
            : e.type === 1
                ? "#66e7ff"
                : "#b9ff67";

    ctx.shadowColor =
        body;

    ctx.shadowBlur = 10;

    ctx.fillStyle =
        body;

    /* antenna */

    ctx.fillRect(
        -1,
        -12,
        2,
        4
    );

    ctx.fillRect(
        -9,
        -10,
        2,
        4
    );

    ctx.fillRect(
        7,
        -10,
        2,
        4
    );

    /* body */

    ctx.fillRect(
        -11,
        -7,
        22,
        14
    );

    ctx.fillRect(
        -15,
        -3,
        4,
        8
    );

    ctx.fillRect(
        11,
        -3,
        4,
        8
    );

    ctx.fillRect(
        -8,
        7,
        4,
        5
    );

    ctx.fillRect(
        4,
        7,
        4,
        5
    );

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#07101b";

    ctx.fillRect(
        -7,
        -3,
        4,
        4
    );

    ctx.fillRect(
        3,
        -3,
        4,
        4
    );

    if(e.hp > 1){

        ctx.fillStyle =
            "rgba(255,255,255,.8)";

        ctx.fillRect(
            -7,
            9,
            14,
            2
        );

    }

    ctx.restore();

}

/* =========================================================
   DRAW DIVING ENEMY
   ========================================================= */

function drawDiving(d){

    ctx.save();

    ctx.translate(
        d.x,
        d.y
    );

    ctx.rotate(
        Math.sin(d.phase)*.35
    );

    ctx.shadowColor =
        "#65f5ff";

    ctx.shadowBlur = 14;

    ctx.fillStyle =
        "#65f5ff";

    ctx.beginPath();

    ctx.moveTo(
        0,
        -13
    );

    ctx.lineTo(
        13,
        8
    );

    ctx.lineTo(
        5,
        6
    );

    ctx.lineTo(
        0,
        14
    );

    ctx.lineTo(
        -5,
        6
    );

    ctx.lineTo(
        -13,
        8
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#07101b";

    ctx.fillRect(
        -4,
        -2,
        8,
        5
    );

    ctx.restore();

}

/* =========================================================
   DRAW BULLETS
   ========================================================= */

function drawBullets(){

    bullets.forEach(b => {

        ctx.save();

        ctx.shadowColor =
            "#fff";

        ctx.shadowBlur = 10;

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            b.x-2,
            b.y,
            4,
            b.h
        );

        ctx.restore();

    });

    enemyBullets.forEach(b => {

        ctx.save();

        ctx.shadowColor =
            "#ff5bcb";

        ctx.shadowBlur = 10;

        ctx.fillStyle =
            "#ff5bcb";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    });

}

/* =========================================================
   DRAW BARRIERS
   ========================================================= */

function drawBarriers(){

    barriers.forEach(barrier => {

        barrier.forEach(cell => {

            if(cell.hp <= 0){
                return;
            }

            ctx.fillStyle =
                cell.hp === 3
                    ? "#55d6a0"
                    : cell.hp === 2
                        ? "#3ba47c"
                        : "#276d55";

            ctx.fillRect(
                cell.x,
                cell.y,
                cell.w-1,
                cell.h-1
            );

        });

    });

}

/* =========================================================
   DRAW POWERUPS
   ========================================================= */

function drawPowerups(){

    powerups.forEach(p => {

        let color = "#fff";

        let symbol = "?";

        if(p.type === "rapid"){

            color = "#ffe65a";
            symbol = "R";

        }

        if(p.type === "spread"){

            color = "#ff55c7";
            symbol = "3";

        }

        if(p.type === "shield"){

            color = "#61eaff";
            symbol = "S";

        }

        if(p.type === "life"){

            color = "#7cff8d";
            symbol = "+";

        }

        ctx.save();

        ctx.translate(
            p.x+p.w/2,
            p.y+p.h/2
        );

        ctx.rotate(
            performance.now()*.002
        );

        ctx.shadowColor =
            color;

        ctx.shadowBlur = 12;

        ctx.fillStyle =
            "rgba(10,14,28,.95)";

        ctx.strokeStyle =
            color;

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.roundRect(
            -10,
            -10,
            20,
            20,
            6
        );

        ctx.fill();

        ctx.stroke();

        ctx.shadowBlur = 0;

        ctx.fillStyle =
            color;

        ctx.font =
            "900 11px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            symbol,
            0,
            1
        );

        ctx.restore();

    });

}

/* =========================================================
   DRAW UFO
   ========================================================= */

function drawUFO(){

    if(!ufo){
        return;
    }

    ctx.save();

    ctx.translate(
        ufo.x,
        ufo.y
    );

    ctx.shadowColor =
        "#ffe85b";

    ctx.shadowBlur = 15;

    ctx.fillStyle =
        "#ffe85b";

    ctx.beginPath();

    ctx.ellipse(
        16,
        8,
        17,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        16,
        4,
        7,
        Math.PI,
        0
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "#17182a";

    ctx.beginPath();

    ctx.arc(
        13,
        4,
        1.5,
        0,
        Math.PI*2
    );

    ctx.arc(
        19,
        4,
        1.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}

/* =========================================================
   DRAW PARTICLES
   ========================================================= */

function drawParticles(){

    particles.forEach(p => {

        const alpha =
            clamp(
                p.life /
                p.maxLife,
                0,
                1
            );

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            "#fff";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    });

    ctx.globalAlpha = 1;

}

/* =========================================================
   DRAW FLOATING TEXT
   ========================================================= */

function drawFloatingTexts(){

    floatingTexts.forEach(t => {

        ctx.globalAlpha =
            clamp(
                t.life,
                0,
                1
            );

        ctx.fillStyle =
            t.color;

        ctx.font =
            "900 11px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            t.text,
            t.x,
            t.y
        );

    });

    ctx.globalAlpha = 1;

}

/* =========================================================
   DRAW HUD IN CANVAS
   ========================================================= */

function drawCanvasHUD(){

    if(gameState !== "playing"){
        return;
    }

    /* vidas */

    ctx.textAlign = "left";

    ctx.font =
        "900 11px Arial";

    ctx.fillStyle =
        "rgba(255,255,255,.55)";

    ctx.fillText(
        "VIDAS",
        15,
        H-82
    );

    for(let i=0;i<player.lives;i++){

        ctx.save();

        ctx.translate(
            17+i*20,
            H-62
        );

        ctx.scale(
            .35,
            .35
        );

        ctx.fillStyle =
            "#ff3db8";

        ctx.beginPath();

        ctx.moveTo(
            0,
            -18
        );

        ctx.lineTo(
            18,
            12
        );

        ctx.lineTo(
            0,
            7
        );

        ctx.lineTo(
            -18,
            12
        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();

    }

    /* combo */

    if(combo >= 2){

        ctx.textAlign =
            "right";

        ctx.font =
            "900 11px Arial";

        ctx.fillStyle =
            "#ff5ac6";

        ctx.fillText(
            "COMBO x"+combo,
            W-15,
            H-82
        );

    }

}

/* =========================================================
   DRAW
   ========================================================= */

function draw(){

    ctx.save();

    if(screenShake > 0){

        ctx.translate(
            rand(-3,3),
            rand(-3,3)
        );

    }

    drawBackground();

    drawBarriers();

    enemies.forEach(
        drawEnemy
    );

    divingEnemies.forEach(
        drawDiving
    );

    drawUFO();

    drawPowerups();

    drawBullets();

    drawPlayer();

    drawParticles();

    drawFloatingTexts();

    drawCanvasHUD();

    ctx.restore();

}

/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(timestamp){

    let dt =
        (timestamp-lastTime) /
        1000;

    lastTime = timestamp;

    /*
       Evitamos saltos enormes
       después de bloquear la pantalla
       o cambiar de aplicación.
    */

    dt =
        clamp(
            dt,
            0,
            .033
        );

    update(dt);

    draw();

    requestAnimationFrame(
        loop
    );

}

/* =========================================================
   BUTTONS
   ========================================================= */

pauseBtn.addEventListener(
    "click",
    e => {

        e.preventDefault();

        startAudio();

        togglePause();

    }
);

startBtn.addEventListener(
    "click",
    startGame
);

instructionsBtn.addEventListener(
    "click",
    showInstructions
);

/* =========================================================
   VISIBILITY
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.hidden &&
            gameState === "playing"
        ){

            togglePause();

        }

    }
);

/* =========================================================
   PREVENT SCROLL / ZOOM
   ========================================================= */

document.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

    },
    {
        passive:false
    }
);

document.addEventListener(
    "gesturestart",
    e => {

        e.preventDefault();

    }
);

document.addEventListener(
    "gesturechange",
    e => {

        e.preventDefault();

    }
);

document.addEventListener(
    "gestureend",
    e => {

        e.preventDefault();

    }
);

/* =========================================================
   INIT
   ========================================================= */

updateHUD();

createFormation();

createBarriers();

lastTime =
    performance.now();

requestAnimationFrame(
    loop
);

</script>

</body>
</html>
