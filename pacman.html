<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">

<title>NEON MAZE</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100dvh;
    max-width:540px;
    overflow:hidden;
    background:#000;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;

    padding:
        max(14px, env(safe-area-inset-top))
        18px
        10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.hudBox{
    min-width:105px;
}

.hudBox.right{
    text-align:right;
}

.label{
    font-size:10px;
    letter-spacing:2px;
    color:#64748b;
    font-weight:800;
}

.value{
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
    text-shadow:
        0 0 8px rgba(0,229,255,.8);
}

#score{
    color:#00e5ff;
}

#lives{
    color:#ff3b81;
    text-shadow:
        0 0 10px rgba(255,59,129,.8);
}

#overlay{
    position:absolute;
    inset:0;
    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,30,45,.5),
            rgba(0,0,0,.94) 70%
        );

    padding:25px;
}

.panel{
    width:min(390px,90%);
    text-align:center;
}

.logo{
    margin-bottom:8px;
    font-size:clamp(42px,12vw,70px);
    line-height:1;
    font-weight:1000;
    letter-spacing:-4px;

    color:#00e5ff;

    text-shadow:
        0 0 8px #00e5ff,
        0 0 20px #00e5ff,
        0 0 50px rgba(0,229,255,.65);
}

.subtitle{
    font-size:11px;
    letter-spacing:5px;
    color:#64748b;
    font-weight:800;
    margin-bottom:34px;
}

.description{
    color:#94a3b8;
    font-size:14px;
    line-height:1.7;
    margin:0 auto 28px;
    max-width:310px;
}

button{
    border:0;
    outline:0;
    cursor:pointer;

    width:100%;
    max-width:280px;

    padding:17px 25px;

    border-radius:14px;

    color:#000;
    background:#00e5ff;

    font-size:16px;
    font-weight:1000;
    letter-spacing:2px;

    box-shadow:
        0 0 10px rgba(0,229,255,.7),
        0 0 35px rgba(0,229,255,.25);

    transition:
        transform .1s ease,
        filter .1s ease;
}

button:active{
    transform:scale(.94);
    filter:brightness(1.35);
}

.secondary{
    margin-top:12px;
    background:#111827;
    color:#94a3b8;
    box-shadow:none;
    border:1px solid #1e293b;
}

#gameOver{
    display:none;
}

.finalScore{
    margin:20px 0 5px;
    color:#00e5ff;
    font-size:48px;
    font-weight:1000;
    text-shadow:
        0 0 10px #00e5ff,
        0 0 30px rgba(0,229,255,.5);
}

.best{
    color:#64748b;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:28px;
}

#ready{
    position:absolute;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);

    z-index:20;

    color:#00e5ff;
    font-size:13px;
    letter-spacing:4px;
    font-weight:900;

    text-shadow:
        0 0 8px #00e5ff,
        0 0 20px #00e5ff;

    pointer-events:none;
}

.hidden{
    display:none!important;
}

#rotateHint{
    position:absolute;
    inset:0;
    z-index:100;

    display:none;
    align-items:center;
    justify-content:center;

    background:#000;
    color:#00e5ff;

    text-align:center;
    padding:40px;
    font-weight:900;
}

@media (orientation:landscape){
    #rotateHint{
        display:flex;
    }
}
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            <div class="label">SCORE</div>
            <div id="score" class="value">0</div>
        </div>

        <div class="hudBox right">
            <div class="label">LIVES</div>
            <div id="lives" class="value">● ● ●</div>
        </div>

    </div>

    <div id="ready">READY</div>

    <div id="overlay">

        <div id="startPanel" class="panel">

            <div class="logo">NEON<br>MAZE</div>

            <div class="subtitle">
                CYBER ARCADE
            </div>

            <p class="description">
                Desliza el dedo para moverte por el laberinto.
                Come todos los puntos, activa los núcleos de energía
                y evita a los cazadores.
            </p>

            <button id="playBtn">
                JUGAR
            </button>

            <button id="howBtn" class="secondary">
                CONTROLES
            </button>

        </div>

        <div id="gameOver" class="panel">

            <div class="subtitle">
                SYSTEM FAILURE
            </div>

            <div class="logo" style="font-size:48px">
                GAME OVER
            </div>

            <div id="finalScore" class="finalScore">
                0
            </div>

            <div id="bestScore" class="best">
                RÉCORD: 0
            </div>

            <button id="retryBtn">
                REINTENTAR
            </button>

            <button id="menuBtn" class="secondary">
                MENÚ
            </button>

        </div>

    </div>

    <div id="rotateHint">
        GIRA EL IPHONE<br>
        <small style="opacity:.5">
            MODO RETRATO REQUERIDO
        </small>
    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    DPR = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    calculateBoard();
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   MAZE
========================================================= */

/*
   # = pared
   . = punto
   o = power pellet
   - = túnel / espacio
*/

const MAP = [
"#####################",
"#o........#........o#",
"#.###.###.#.###.###.#",
"#...................#",
"#.###.#.#######.#.###",
"#.....#....#....#....#",
"#####.###.#.#.###.###",
"-----.#...#.#...#----",
"#####.#.#####.#.######",
"#.......     .........#",
"#.###.#.#####.#.###..#",
"#...#.#...#...#.#....#",
"###.#.###.#.###.#.####",
"#...#.....#.....#.....#",
"#.#####.#######.#####.#",
"#o...................o#",
"#####################"
];

/*
   La anchura visual se adapta al dispositivo.
*/

let TILE = 20;
let boardX = 0;
let boardY = 0;

let grid = [];

function normalizeMap(){

    const width = Math.max(...MAP.map(r=>r.length));

    grid = MAP.map(row => {

        let r = row;

        while(r.length < width){
            r += "#";
        }

        return r.split("");
    });
}

normalizeMap();

const ROWS = grid.length;
const COLS = grid[0].length;

function calculateBoard(){

    const availableW = W - 16;
    const availableH = H - 125;

    TILE = Math.floor(
        Math.min(
            availableW / COLS,
            availableH / ROWS
        )
    );

    TILE = Math.max(12,TILE);

    boardX = Math.floor(
        (W - COLS*TILE)/2
    );

    boardY = Math.floor(
        92 +
        (availableH - ROWS*TILE)/2
    );
}


/* =========================================================
   GAME STATE
========================================================= */

let score = 0;
let highScore =
    Number(localStorage.getItem("neonMazeHighScore") || 0);

let lives = 3;
let level = 1;

let pellets = 0;
let powerPellets = 0;

let gameRunning = false;
let paused = false;

let powerTimer = 0;

let lastTime = 0;

let shake = 0;

let particles = [];

let frightenedBlink = false;


/* =========================================================
   PLAYER
========================================================= */

const player = {
    x:10,
    y:15,

    px:10,
    py:15,

    dirX:0,
    dirY:0,

    nextX:0,
    nextY:0,

    speed:4.7,

    radius:.39,

    mouth:0,

    moving:false
};


/* =========================================================
   GHOSTS
========================================================= */

const ghostData = [
    {
        name:"BLITZ",
        color:"#ff3158",
        x:9,
        y:9,
        homeX:9,
        homeY:9,
        mode:"chase"
    },
    {
        name:"VOLT",
        color:"#ff8a00",
        x:10,
        y:9,
        homeX:10,
        homeY:9,
        mode:"chase"
    },
    {
        name:"NOVA",
        color:"#00e5ff",
        x:11,
        y:9,
        homeX:11,
        homeY:9,
        mode:"scatter"
    },
    {
        name:"ECHO",
        color:"#ff54df",
        x:12,
        y:9,
        homeX:12,
        homeY:9,
        mode:"chase"
    }
];

let ghosts = [];


/* =========================================================
   HELPERS
========================================================= */

function isWall(x,y){

    if(y < 0 || y >= ROWS){
        return false;
    }

    if(x < 0 || x >= COLS){
        return false;
    }

    return grid[y][x] === "#";
}

function wrapX(x){

    if(x < 0) return COLS - 1;
    if(x >= COLS) return 0;

    return x;
}

function canMove(x,y){

    x = wrapX(x);

    if(y < 0 || y >= ROWS) return false;

    return !isWall(x,y);
}

function distance(a,b,c,d){

    return Math.hypot(a-c,b-d);
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}


/* =========================================================
   RESET LEVEL
========================================================= */

function resetPellets(){

    pellets = 0;
    powerPellets = 0;

    for(let y=0;y<ROWS;y++){

        for(let x=0;x<COLS;x++){

            if(grid[y][x] === "." ||
               grid[y][x] === "o"){

                pellets++;

                if(grid[y][x] === "o"){
                    powerPellets++;
                }
            }
        }
    }
}

function resetActors(){

    player.x = 10;
    player.y = 15;

    player.px = player.x;
    player.py = player.y;

    player.dirX = 0;
    player.dirY = 0;

    player.nextX = 0;
    player.nextY = 0;

    ghosts = ghostData.map((g,i)=>({

        ...g,

        x:g.x,
        y:g.y,

        px:g.x,
        py:g.y,

        dirX:i%2===0 ? 1 : -1,
        dirY:0,

        dead:false,

        respawn:0
    }));
}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

    score = 0;
    lives = 3;
    level = 1;

    powerTimer = 0;

    particles = [];

    resetPellets();
    resetActors();

    updateHUD();

    document.getElementById("overlay")
        .style.display="none";

    document.getElementById("ready")
        .classList.remove("hidden");

    gameRunning = true;

    setTimeout(()=>{

        document.getElementById("ready")
            .classList.add("hidden");

    },900);

    navigator.vibrate?.(25);
}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    gameRunning = false;

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "neonMazeHighScore",
            highScore
        );
    }

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("bestScore")
        .textContent =
        "RÉCORD: " + highScore;

    document.getElementById("overlay")
        .style.display="flex";

    document.getElementById("startPanel")
        .style.display="none";

    document.getElementById("gameOver")
        .style.display="block";

    navigator.vibrate?.([80,40,100]);
}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function nextLevel(){

    level++;

    score += 1000;

    powerTimer = 0;

    resetPellets();
    resetActors();

    player.speed =
        Math.min(
            7.0,
            4.7 + level * .22
        );

    updateHUD();

    createBurst(
        boardX + player.x*TILE + TILE/2,
        boardY + player.y*TILE + TILE/2,
        "#00e5ff",
        60
    );

    navigator.vibrate?.(40);
}


/* =========================================================
   INPUT
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        const t = e.changedTouches[0];

        touchStartX = t.clientX;
        touchStartY = t.clientY;

    },
    {passive:false}
);

document.addEventListener(
    "touchend",
    e => {

        e.preventDefault();

        if(!gameRunning) return;

        const t = e.changedTouches[0];

        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;

        if(Math.abs(dx) < 18 &&
           Math.abs(dy) < 18){

            return;
        }

        if(Math.abs(dx) > Math.abs(dy)){

            setDirection(
                dx > 0 ? 1 : -1,
                0
            );

        }else{

            setDirection(
                0,
                dy > 0 ? 1 : -1
            );
        }

        navigator.vibrate?.(8);

    },
    {passive:false}
);

function setDirection(dx,dy){

    player.nextX = dx;
    player.nextY = dy;
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener("keydown",e=>{

    const key = e.key.toLowerCase();

    if(key==="arrowup" || key==="w")
        setDirection(0,-1);

    if(key==="arrowdown" || key==="s")
        setDirection(0,1);

    if(key==="arrowleft" || key==="a")
        setDirection(-1,0);

    if(key==="arrowright" || key==="d")
        setDirection(1,0);

});


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    player.px = player.x;
    player.py = player.y;

    /*
       Cambiar dirección solo cuando estamos
       suficientemente centrados en una celda.
    */

    const nearCenter =
        Math.abs(player.x - Math.round(player.x)) < .12 &&
        Math.abs(player.y - Math.round(player.y)) < .12;

    if(nearCenter){

        player.x = Math.round(player.x);
        player.y = Math.round(player.y);

        if(
            canMove(
                player.x + player.nextX,
                player.y + player.nextY
            )
        ){

            player.dirX = player.nextX;
            player.dirY = player.nextY;
        }
    }

    const speed =
        player.speed *
        (1 + (level-1)*.025);

    let nx =
        player.x +
        player.dirX * speed * dt;

    let ny =
        player.y +
        player.dirY * speed * dt;

    /*
       Comprobar paredes.
    */

    if(player.dirX !== 0){

        const targetX =
            player.dirX > 0
            ? Math.floor(nx + .45)
            : Math.floor(nx - .45);

        const cy =
            Math.round(player.y);

        if(isWall(targetX,cy)){

            nx = player.x;
            player.dirX = 0;

        }
    }

    if(player.dirY !== 0){

        const targetY =
            player.dirY > 0
            ? Math.floor(ny + .45)
            : Math.floor(ny - .45);

        const cx =
            Math.round(player.x);

        if(isWall(cx,targetY)){

            ny = player.y;
            player.dirY = 0;

        }
    }

    player.x = wrapX(nx);
    player.y = ny;

    player.moving =
        player.dirX !== 0 ||
        player.dirY !== 0;

    player.mouth += dt * 15;

    eatPellet();
}


/* =========================================================
   EAT PELLET
========================================================= */

function eatPellet(){

    const x = Math.round(player.x);
    const y = Math.round(player.y);

    if(y<0 || y>=ROWS ||
       x<0 || x>=COLS){

        return;
    }

    const cell = grid[y][x];

    if(cell === "."){

        grid[y][x] = " ";

        pellets--;

        score += 10;

        createBurst(
            boardX+x*TILE+TILE/2,
            boardY+y*TILE+TILE/2,
            "#ffe66d",
            3
        );

    }

    if(cell === "o"){

        grid[y][x] = " ";

        pellets--;
        powerPellets--;

        score += 50;

        powerTimer = 7;

        frightenedBlink = false;

        createBurst(
            boardX+x*TILE+TILE/2,
            boardY+y*TILE+TILE/2,
            "#00e5ff",
            30
        );

        shake = 7;

        navigator.vibrate?.([20,20,50]);
    }

    if(pellets <= 0){

        nextLevel();
    }

    updateHUD();
}


/* =========================================================
   GHOST AI
========================================================= */

function updateGhost(g,dt,index){

    if(g.dead){

        g.respawn -= dt;

        if(g.respawn <= 0){

            g.dead = false;

            g.x = g.homeX;
            g.y = g.homeY;
        }

        return;
    }

    /*
       Los fantasmas solo toman decisiones
       al llegar a una celda.
    */

    const centered =
        Math.abs(g.x - Math.round(g.x)) < .08 &&
        Math.abs(g.y - Math.round(g.y)) < .08;

    if(centered){

        g.x = Math.round(g.x);
        g.y = Math.round(g.y);

        chooseGhostDirection(g,index);
    }

    let speed =
        3.1 +
        Math.min(level*.15,1.5);

    if(powerTimer > 0){
        speed *= .62;
    }

    if(g.dead){
        speed *= 1.4;
    }

    g.x = wrapX(
        g.x + g.dirX * speed * dt
    );

    g.y +=
        g.dirY * speed * dt;
}


/* =========================================================
   GHOST PATH CHOICE
========================================================= */

function chooseGhostDirection(g,index){

    const dirs = [
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    /*
       No permitir inmediatamente
       dar media vuelta salvo necesidad.
    */

    const reverseX = -g.dirX;
    const reverseY = -g.dirY;

    let options = dirs.filter(d => {

        if(d.x===reverseX &&
           d.y===reverseY &&
           dirs.length>1){

            return false;
        }

        return canMove(
            Math.round(g.x)+d.x,
            Math.round(g.y)+d.y
        );
    });

    if(!options.length){

        options = dirs.filter(d =>
            canMove(
                Math.round(g.x)+d.x,
                Math.round(g.y)+d.y
            )
        );
    }

    if(!options.length) return;

    /*
       Durante power mode los fantasmas
       intentan alejarse del jugador.
    */

    if(powerTimer > 0){

        options.sort((a,b)=>{

            const da =
                distance(
                    g.x+a.x,
                    g.y+a.y,
                    player.x,
                    player.y
                );

            const db =
                distance(
                    g.x+b.x,
                    g.y+b.y,
                    player.x,
                    player.y
                );

            return db-da;
        });

        const choices =
            options.slice(
                0,
                Math.min(2,options.length)
            );

        const d =
            choices[
                Math.floor(
                    Math.random()*choices.length
                )
            ];

        g.dirX = d.x;
        g.dirY = d.y;

        return;
    }

    /*
       IA de persecución con pequeños
       comportamientos diferenciados.
    */

    let targetX = player.x;
    let targetY = player.y;

    if(g.mode==="scatter"){

        const corners = [
            [1,1],
            [COLS-2,1],
            [1,ROWS-2],
            [COLS-2,ROWS-2]
        ];

        [targetX,targetY] =
            corners[index % corners.length];

    }else{

        /*
           Cada fantasma anticipa ligeramente
           el movimiento del jugador.
        */

        const anticipation =
            index === 0 ? 1 :
            index === 1 ? 2 :
            index === 2 ? -1 : 3;

        targetX =
            player.x +
            player.dirX * anticipation;

        targetY =
            player.y +
            player.dirY * anticipation;
    }

    /*
       Con probabilidad pequeña hacen
       un movimiento aleatorio para evitar
       que los cuatro sean idénticos.
    */

    if(Math.random() < .08){

        const d =
            options[
                Math.floor(
                    Math.random()*options.length
                )
            ];

        g.dirX = d.x;
        g.dirY = d.y;

        return;
    }

    options.sort((a,b)=>{

        const da =
            distance(
                g.x+a.x,
                g.y+a.y,
                targetX,
                targetY
            );

        const db =
            distance(
                g.x+b.x,
                g.y+b.y,
                targetX,
                targetY
            );

        return da-db;
    });

    const d = options[0];

    g.dirX = d.x;
    g.dirY = d.y;
}


/* =========================================================
   COLLISIONS
========================================================= */

function checkCollisions(){

    for(const g of ghosts){

        if(g.dead) continue;

        const d =
            distance(
                player.x,
                player.y,
                g.x,
                g.y
            );

        if(d < .62){

            if(powerTimer > 0){

                /*
                   Ghost eaten.
                */

                g.dead = true;
                g.respawn = 2;

                score += 200;

                createBurst(
                    boardX+g.x*TILE+TILE/2,
                    boardY+g.y*TILE+TILE/2,
                    "#00e5ff",
                    25
                );

                shake = 5;

                navigator.vibrate?.(30);

                updateHUD();

            }else{

                loseLife();

                return;
            }
        }
    }
}


/* =========================================================
   LOSE LIFE
========================================================= */

function loseLife(){

    lives--;

    shake = 14;

    createBurst(
        boardX+player.x*TILE+TILE/2,
        boardY+player.y*TILE+TILE/2,
        "#ff3158",
        45
    );

    navigator.vibrate?.([70,30,70]);

    updateHUD();

    if(lives <= 0){

        gameOver();

        return;
    }

    /*
       Pausa corta.
    */

    paused = true;

    setTimeout(()=>{

        resetActors();

        paused = false;

        document.getElementById("ready")
            .classList.remove("hidden");

        setTimeout(()=>{

            document.getElementById("ready")
                .classList.add("hidden");

        },700);

    },650);
}


/* =========================================================
   PARTICLES
========================================================= */

function createBurst(x,y,color,count){

    for(let i=0;i<count;i++){

        const angle =
            Math.random()*Math.PI*2;

        const speed =
            .5 + Math.random()*2.8;

        particles.push({

            x,
            y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            life:.35 + Math.random()*.55,

            max:.35 + Math.random()*.55,

            size:1 + Math.random()*3,

            color
        });
    }
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= dt;

        if(p.life <= 0){

            particles.splice(i,1);
        }
    }
}

function drawParticles(){

    for(const p of particles){

        const alpha =
            clamp(p.life/p.max,0,1);

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.fillStyle = p.color;

        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================================================
   DRAW MAZE
========================================================= */

function drawMaze(){

    /*
       Fondo del área.
    */

    ctx.fillStyle="#000";

    ctx.fillRect(
        boardX,
        boardY,
        COLS*TILE,
        ROWS*TILE
    );

    /*
       Paredes.
    */

    ctx.save();

    ctx.shadowColor="#0066ff";
    ctx.shadowBlur=7;

    for(let y=0;y<ROWS;y++){

        for(let x=0;x<COLS;x++){

            if(grid[y][x] !== "#") continue;

            const px =
                boardX+x*TILE;

            const py =
                boardY+y*TILE;

            ctx.strokeStyle="#063cff";

            ctx.lineWidth =
                Math.max(1.5,TILE*.10);

            ctx.beginPath();

            /*
               Dibujar segmentos evitando
               un bloque demasiado sólido.
            */

            ctx.roundRect(
                px+TILE*.12,
                py+TILE*.12,
                TILE*.76,
                TILE*.76,
                TILE*.16
            );

            ctx.stroke();
        }
    }

    ctx.restore();


    /*
       Pellets.
    */

    for(let y=0;y<ROWS;y++){

        for(let x=0;x<COLS;x++){

            const cell = grid[y][x];

            const cx =
                boardX+x*TILE+TILE/2;

            const cy =
                boardY+y*TILE+TILE/2;

            if(cell === "."){

                ctx.save();

                ctx.fillStyle="#ffe66d";

                ctx.shadowColor="#ffe66d";
                ctx.shadowBlur=5;

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    Math.max(1.3,TILE*.075),
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.restore();
            }

            if(cell === "o"){

                const pulse =
                    1 +
                    Math.sin(performance.now()*.007)*.18;

                ctx.save();

                ctx.fillStyle="#fff";

                ctx.shadowColor="#00e5ff";
                ctx.shadowBlur=18;

                ctx.beginPath();

                ctx.arc(
                    cx,
                    cy,
                    TILE*.22*pulse,
                    0,
                    Math.PI*2
                );

                ctx.fill();

                ctx.restore();
            }
        }
    }
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(){

    const cx =
        boardX+
        player.x*TILE+
        TILE/2;

    const cy =
        boardY+
        player.y*TILE+
        TILE/2;

    const r =
        TILE*.40;

    let angle = 0;

    if(player.dirX < 0) angle=Math.PI;
    if(player.dirY < 0) angle=-Math.PI/2;
    if(player.dirY > 0) angle=Math.PI/2;

    const mouth =
        player.moving
        ? .20 + Math.abs(Math.sin(player.mouth))*.28
        : .18;

    ctx.save();

    ctx.translate(cx,cy);
    ctx.rotate(angle);

    ctx.fillStyle="#ffe600";

    ctx.shadowColor="#ffe600";
    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.arc(
        0,
        0,
        r,
        mouth,
        Math.PI*2-mouth
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =========================================================
   DRAW GHOST
========================================================= */

function drawGhost(g){

    const cx =
        boardX+
        g.x*TILE+
        TILE/2;

    const cy =
        boardY+
        g.y*TILE+
        TILE/2;

    const r =
        TILE*.39;

    let color = g.color;

    if(powerTimer > 0){

        if(
            powerTimer < 2 &&
            Math.floor(powerTimer*6)%2===0
        ){

            color="#fff";

        }else{

            color="#006cff";
        }
    }

    ctx.save();

    ctx.translate(cx,cy);

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=15;

    /*
       Cabeza.
    */

    ctx.beginPath();

    ctx.arc(
        0,
        -r*.05,
        r,
        Math.PI,
        0
    );

    /*
       Laterales + parte inferior.
    */

    ctx.lineTo(r,r*.75);

    ctx.lineTo(r*.45,r*.52);
    ctx.lineTo(0,r*.82);
    ctx.lineTo(-r*.45,r*.52);
    ctx.lineTo(-r,r*.75);

    ctx.closePath();

    ctx.fill();

    /*
       Ojos.
    */

    if(powerTimer <= 0){

        ctx.fillStyle="#fff";

        ctx.beginPath();
        ctx.ellipse(
            -r*.34,
            -r*.10,
            r*.20,
            r*.28,
            0,0,Math.PI*2
        );
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(
            r*.34,
            -r*.10,
            r*.20,
            r*.28,
            0,0,Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle="#06101f";

        const ex =
            g.dirX * r*.08;

        const ey =
            g.dirY * r*.08;

        ctx.beginPath();

        ctx.arc(
            -r*.34+ex,
            -r*.10+ey,
            r*.09,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.arc(
            r*.34+ex,
            -r*.10+ey,
            r*.09,
            0,
            Math.PI*2
        );

        ctx.fill();

    }else{

        /*
           Ojos asustados.
        */

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            -r*.25,
            -r*.10,
            r*.09,
            0,
            Math.PI*2
        );

        ctx.arc(
            r*.25,
            -r*.10,
            r*.09,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#fff";
        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.moveTo(-r*.35,r*.25);

        for(let i=0;i<5;i++){

            ctx.lineTo(
                -r*.35+i*r*.18,
                r*.25 +
                (i%2 ? r*.10 : 0)
            );
        }

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="#000";

    ctx.fillRect(0,0,W,H);

    let sx = 0;
    let sy = 0;

    if(shake > 0){

        sx =
            (Math.random()-.5)*shake;

        sy =
            (Math.random()-.5)*shake;
    }

    ctx.save();

    ctx.translate(sx,sy);

    drawMaze();

    for(const g of ghosts){

        if(!g.dead){

            drawGhost(g);
        }
    }

    drawPlayer();

    drawParticles();

    ctx.restore();

    /*
       Línea decorativa inferior.
    */

    ctx.save();

    ctx.globalAlpha=.5;

    ctx.strokeStyle="#07111d";

    ctx.beginPath();

    ctx.moveTo(18,H-22);
    ctx.lineTo(W-18,H-22);

    ctx.stroke();

    ctx.restore();
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("score")
        .textContent = score;

    let lifeText="";

    for(let i=0;i<lives;i++){
        lifeText += "● ";
    }

    document.getElementById("lives")
        .textContent = lifeText.trim();
}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    if(!gameRunning || paused) return;

    if(powerTimer > 0){

        powerTimer -= dt;

        if(powerTimer < 0){
            powerTimer = 0;
        }
    }

    updatePlayer(dt);

    for(
        let i=0;
        i<ghosts.length;
        i++
    ){

        updateGhost(
            ghosts[i],
            dt,
            i
        );
    }

    checkCollisions();

    updateParticles(dt);

    shake *= .88;

    if(shake < .1){
        shake=0;
    }
}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(time){

    if(!lastTime){
        lastTime=time;
    }

    let dt =
        (time-lastTime)/1000;

    lastTime=time;

    /*
       Evitar saltos enormes al volver
       de segundo plano.
    */

    dt=Math.min(dt,.035);

    update(dt);

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

   BUTTONS
========================================================= */

    e.preventDefault();

document.getElementById("playBtn")

    newGame();

    e.preventDefault();

document.getElementById("retryBtn")

/* =========================================================
   PREVENT IOS GESTURES
========================================================= */

document.addEventListener(
    "gesturestart",
    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(
    "gesturechange",
    e=>e.preventDefault(),
    {passive:false}
);

document.addEventListener(
    "gestureend",
    e=>e.preventDefault(),
    {passive:false}
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(document.hidden){

            paused=true;

        }else{

            if(gameRunning){
                paused=false;
            }

            lastTime=
                performance.now();
        }
    }
);


/* =========================================================
   INITIAL HUD
========================================================= */

updateHUD();

</script>
