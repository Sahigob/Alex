<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050509">

<title>NEON MAZE</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050509;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:none;
}

button{
    font:inherit;
}

#app{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050509;
}

#shell{
    position:relative;
    width:min(100vw,560px);
    height:min(100vh,900px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:
        calc(10px + env(safe-area-inset-top))
        10px
        calc(10px + env(safe-area-inset-bottom));
}

#hud{
    width:min(94vw,520px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:8px;
}

.stat{
    min-width:92px;
    text-align:center;
}

.label{
    font-size:9px;
    letter-spacing:2px;
    color:#777;
    text-transform:uppercase;
}

.value{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
}

#gameWrap{
    position:relative;
    width:min(94vw,520px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    background:#000;
    border:1px solid #181825;
    border-radius:14px;
    box-shadow:
        0 0 22px rgba(0,220,255,.10),
        inset 0 0 30px rgba(0,0,0,.8);
    touch-action:none;
}

#overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    border-radius:14px;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);
    z-index:5;
}

.panel{
    width:min(90%,390px);
    text-align:center;
    border:1px solid #202033;
    border-radius:20px;
    padding:28px 22px;
    background:rgba(9,9,16,.96);
    box-shadow:0 0 35px rgba(0,229,255,.10);
}

.logo{
    font-size:38px;
    font-weight:1000;
    letter-spacing:5px;
    color:#fff;
    text-shadow:
        0 0 12px #00e5ff,
        0 0 28px rgba(0,229,255,.55);
}

.subtitle{
    font-size:11px;
    letter-spacing:3px;
    color:#888;
    margin:9px 0 24px;
}

.btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px 16px;
    margin-top:10px;
    font-weight:900;
    letter-spacing:2px;
    color:#001014;
    background:#00e5ff;
    box-shadow:0 0 20px rgba(0,229,255,.25);
    touch-action:manipulation;
    cursor:pointer;
}

.btn.secondary{
    background:#161622;
    color:#ddd;
    border:1px solid #29293b;
    box-shadow:none;
}

#help{
    font-size:11px;
    line-height:1.6;
    color:#888;
    margin-top:18px;
}

#toast{
    position:absolute;
    left:50%;
    top:10%;
    transform:translateX(-50%);
    padding:8px 13px;
    border-radius:999px;
    background:rgba(0,0,0,.72);
    border:1px solid #27273b;
    font-size:11px;
    letter-spacing:1px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:4;
    white-space:nowrap;
}

#toast.show{
    opacity:1;
}

@media(max-height:650px){

    #shell{
        padding-top:4px;
        padding-bottom:4px;
    }

    #hud{
        margin-bottom:4px;
    }

    .value{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="shell">

        <div id="hud">

            <div class="stat">
                <div class="label">Puntuación</div>
                <div id="score" class="value">0</div>
            </div>

            <div class="stat">
                <div class="label">Récord</div>
                <div id="high" class="value">0</div>
            </div>

            <div class="stat">
                <div class="label">Vidas</div>
                <div id="lives" class="value">●●●</div>
            </div>

        </div>

        <div id="gameWrap">

            <canvas id="gameCanvas"></canvas>

            <div id="toast"></div>

            <div id="overlay">

                <div class="panel">

                    <div id="panelLogo" class="logo">
                        NEON MAZE
                    </div>

                    <div id="panelSubtitle" class="subtitle">
                        ARCADE • MOBILE • 80s
                    </div>

                    <button id="startBtn" class="btn">
                        JUGAR
                    </button>

                    <button id="controlsBtn" class="btn secondary">
                        CONTROLES
                    </button>

                    <div id="help">
                        Desliza sobre el laberinto para moverte.<br>
                        En PC: flechas o WASD.
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

(() => {

"use strict";


/* =========================================================
   ELEMENTOS
========================================================= */

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const overlay =
    document.getElementById("overlay");

const startBtn =
    document.getElementById("startBtn");

const controlsBtn =
    document.getElementById("controlsBtn");

const scoreEl =
    document.getElementById("score");

const highEl =
    document.getElementById("high");

const livesEl =
    document.getElementById("lives");

const toast =
    document.getElementById("toast");

const panelLogo =
    document.getElementById("panelLogo");

const panelSubtitle =
    document.getElementById("panelSubtitle");

const help =
    document.getElementById("help");


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const COLS = 21;
const ROWS = 21;

const DIRS = {

    left:{
        x:-1,
        y:0
    },

    right:{
        x:1,
        y:0
    },

    up:{
        x:0,
        y:-1
    },

    down:{
        x:0,
        y:1
    },

    none:{
        x:0,
        y:0
    }

};

const DIR_LIST = [
    "left",
    "right",
    "up",
    "down"
];


/* =========================================================
   ESTADO
========================================================= */

let DPR = 1;

let W = 0;
let H = 0;

let cell = 20;

let maze = [];

let pellets = new Set();

let player = null;

let ghosts = [];

let score = 0;

let highScore = loadHighScore();

let lives = 3;

let level = 1;

let running = false;

let paused = false;

let frightenedUntil = 0;

let lastTime = 0;

let toastTimer = null;

let swipeStart = null;


/* =========================================================
   RÉCORD
========================================================= */

function loadHighScore(){

    try{

        return Number(
            localStorage.getItem(
                "neonMazeHigh"
            ) || 0
        );

    }catch(error){

        return 0;

    }

}

function saveHighScore(){

    try{

        localStorage.setItem(
            "neonMazeHigh",
            String(highScore)
        );

    }catch(error){}

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    scoreEl.textContent =
        score;

    highEl.textContent =
        highScore;

    livesEl.textContent =
        "●".repeat(
            Math.max(0,lives)
        ) +
        "○".repeat(
            Math.max(0,3-lives)
        );

}


function addScore(points){

    score += points;

    if(score > highScore){

        highScore = score;

        saveHighScore();

    }

    updateHUD();

}


/* =========================================================
   GRID
========================================================= */

function gridKey(x,y){

    return x + "," + y;

}


function inside(x,y){

    return (
        x >= 0 &&
        x < COLS &&
        y >= 0 &&
        y < ROWS
    );

}


function isOpen(x,y){

    return (
        inside(x,y) &&
        maze[y][x] === 0
    );

}


/* =========================================================
   GENERADOR DE LABERINTO
========================================================= */

function generateMaze(){

    maze =
        Array.from(
            {
                length:ROWS
            },
            () =>
                Array(COLS).fill(1)
        );


    const stack = [
        [1,1]
    ];

    maze[1][1] = 0;


    while(stack.length){

        const current =
            stack[
                stack.length - 1
            ];

        const x = current[0];
        const y = current[1];

        const candidates = [];


        const possible = [

            [ 2, 0 ],
            [-2, 0 ],
            [ 0, 2 ],
            [ 0,-2 ]

        ];


        for(const d of possible){

            const nx =
                x + d[0];

            const ny =
                y + d[1];


            if(

                nx > 0 &&
                nx < COLS - 1 &&
                ny > 0 &&
                ny < ROWS - 1 &&
                maze[ny][nx] === 1

            ){

                candidates.push([
                    nx,
                    ny,
                    d[0] / 2,
                    d[1] / 2
                ]);

            }

        }


        if(!candidates.length){

            stack.pop();

            continue;

        }


        const choice =
            candidates[
                Math.floor(
                    Math.random() *
                    candidates.length
                )
            ];


        const nx = choice[0];
        const ny = choice[1];

        const wx = choice[2];
        const wy = choice[3];


        maze[y + wy][x + wx] = 0;

        maze[ny][nx] = 0;

        stack.push([
            nx,
            ny
        ]);

    }


    /* Abrimos algunos muros para crear
       rutas alternativas */

    for(
        let i = 0;
        i < 45;
        i++
    ){

        const x =
            1 +
            Math.floor(
                Math.random() *
                (COLS - 2)
            );

        const y =
            1 +
            Math.floor(
                Math.random() *
                (ROWS - 2)
            );


        if(maze[y][x] !== 1)
            continue;


        const horizontal =
            isOpen(x-1,y) &&
            isOpen(x+1,y);

        const vertical =
            isOpen(x,y-1) &&
            isOpen(x,y+1);


        if(horizontal || vertical){

            maze[y][x] = 0;

        }

    }


    /* =====================================================
       ZONA CENTRAL
    ===================================================== */

    for(
        let y=9;
        y<=11;
        y++
    ){

        for(
            let x=8;
            x<=12;
            x++
        ){

            maze[y][x] = 0;

        }

    }


    /* =====================================================
       SALIDA DEL JUGADOR
    ===================================================== */

    for(
        let x=8;
        x<=12;
        x++
    ){

        maze[18][x] = 0;

    }

    maze[17][10] = 0;
    maze[16][10] = 0;


    /* =====================================================
       CONECTAR POSIBLES BOLSAS
    ===================================================== */

    ensureConnectivity();

}


/* =========================================================
   CONECTIVIDAD
========================================================= */

function ensureConnectivity(){

    const start = [10,18];

    const visited =
        new Set([
            gridKey(
                start[0],
                start[1]
            )
        ]);

    const queue = [start];


    while(queue.length){

        const current =
            queue.shift();

        const x = current[0];
        const y = current[1];


        for(const dir of DIR_LIST){

            const nx =
                x + DIRS[dir].x;

            const ny =
                y + DIRS[dir].y;


            if(
                isOpen(nx,ny) &&
                !visited.has(
                    gridKey(nx,ny)
                )
            ){

                visited.add(
                    gridKey(nx,ny)
                );

                queue.push([
                    nx,
                    ny
                ]);

            }

        }

    }

}


/* =========================================================
   PELLETS
========================================================= */

function placePellets(){

    pellets.clear();


    for(
        let y=1;
        y<ROWS-1;
        y++
    ){

        for(
            let x=1;
            x<COLS-1;
            x++
        ){

            if(
                isOpen(x,y)
            ){

                pellets.add(
                    gridKey(x,y)
                );

            }

        }

    }


    /* Zona central vacía */

    for(
        let y=8;
        y<=12;
        y++
    ){

        for(
            let x=7;
        x<=13;
        x++
        ){

            pellets.delete(
                gridKey(x,y)
            );

        }

    }


    /* Salida */

    pellets.delete(
        gridKey(10,18)
    );

    pellets.delete(
        gridKey(10,17)
    );

    pellets.delete(
        gridKey(10,16)
    );


    /* Cuatro Power Pellets */

    const powerPositions = [

        [1,1],
        [COLS-2,1],
        [1,ROWS-2],
        [COLS-2,ROWS-2]

    ];


    for(
        const position of powerPositions
    ){

        const x = position[0];
        const y = position[1];

        if(isOpen(x,y)){

            pellets.add(
                gridKey(x,y)
            );

        }

    }

}


/* =========================================================
   ENTIDADES
========================================================= */

function createEntity(
    x,
    y,
    dir,
    speed
){

    return {

        x:x,
        y:y,

        dir:dir,

        nextDir:dir,

        speed:speed,

        anim:0,

        id:0,

        home:[x,y]

    };

}


/* =========================================================
   POSICIONES
========================================================= */

function resetPositions(){

    player =
        createEntity(
            10,
            18,
            "up",
            0.105 +
            level * 0.003
        );


    const starts = [

        [9,10,"left"],
        [10,10,"up"],
        [11,10,"right"],
        [10,9,"down"]

    ];


    ghosts =
        starts.map(
            (s,index)=>{

                const ghost =
                    createEntity(
                        s[0],
                        s[1],
                        s[2],
                        0.080 +
                        level * 0.002
                    );


                ghost.id =
                    index;


                ghost.home =
                    [
                        index % 2 === 0
                            ? 1
                            : COLS - 2,

                        index < 2
                            ? 1
                            : ROWS - 2
                    ];


                return ghost;

            }
        );


    frightenedUntil = 0;

}


/* =========================================================
   NUEVO NIVEL
========================================================= */

function newLevel(){

    generateMaze();

    placePellets();

    resetPositions();

    showToast(
        "NIVEL " + level
    );

}


/* =========================================================
   INICIO
========================================================= */

function startGame(){

    score = 0;

    lives = 3;

    level = 1;

    running = true;

    paused = false;


    panelLogo.textContent =
        "NEON MAZE";

    panelSubtitle.textContent =
        "ARCADE • MOBILE • 80s";


    newLevel();

    overlay.style.display =
        "none";


    updateHUD();

    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    running = false;

    overlay.style.display =
        "flex";


    panelLogo.textContent =
        "GAME OVER";

    panelSubtitle.textContent =
        "PUNTUACIÓN " + score;


    startBtn.textContent =
        "JUGAR DE NUEVO";


    help.innerHTML =
        "Desliza sobre el laberinto para moverte.<br>" +
        "En PC: flechas o WASD.";

}


/* =========================================================
   PERDER VIDA
========================================================= */

function loseLife(){

    lives--;

    updateHUD();


    if(lives <= 0){

        gameOver();

        return;

    }


    running = false;

    showToast(
        "¡TE HAN ATRAPADO!"
    );


    setTimeout(()=>{

        resetPositions();

        running = true;

        lastTime =
            performance.now();

        requestAnimationFrame(
            gameLoop
        );

    },900);

}


/* =========================================================
   DIRECCIONES
========================================================= */

function canMove(
    x,
    y,
    direction
){

    const d =
        DIRS[direction];


    return isOpen(
        Math.round(x) + d.x,
        Math.round(y) + d.y
    );

}


function nearCenter(value){

    return (
        Math.abs(
            value -
            Math.round(value)
        ) < 0.045
    );

}


function legalDirections(entity){

    const x =
        Math.round(entity.x);

    const y =
        Math.round(entity.y);


    return DIR_LIST.filter(
        direction =>
            isOpen(
                x + DIRS[direction].x,
                y + DIRS[direction].y
            )
    );

}


/* =========================================================
   MOVIMIENTO
========================================================= */

function moveEntity(
    entity,
    dt
){

    const speed =
        entity.speed *
        (dt / 16.6667);


    if(
        nearCenter(entity.x) &&
        nearCenter(entity.y)
    ){

        entity.x =
            Math.round(entity.x);

        entity.y =
            Math.round(entity.y);


        if(
            entity.nextDir !== "none" &&
            canMove(
                entity.x,
                entity.y,
                entity.nextDir
            )
        ){

            entity.dir =
                entity.nextDir;

        }


        if(
            entity.dir !== "none" &&
            !canMove(
                entity.x,
                entity.y,
                entity.dir
            )
        ){

            entity.dir =
                "none";

        }

    }


    if(entity.dir !== "none"){

        const d =
            DIRS[entity.dir];


        entity.x +=
            d.x * speed;

        entity.y +=
            d.y * speed;

    }


    /* túneles */

    if(entity.x < 0)
        entity.x = COLS - 1;

    if(entity.x > COLS - 1)
        entity.x = 0;

    if(entity.y < 0)
        entity.y = ROWS - 1;

    if(entity.y > ROWS - 1)
        entity.y = 0;


    entity.anim +=
        dt * 0.012;

}


/* =========================================================
   IA FANTASMAS
========================================================= */

function chooseGhostDirection(
    ghost
){

    if(
        !nearCenter(ghost.x) ||
        !nearCenter(ghost.y)
    ){

        return;

    }


    const options =
        legalDirections(
            ghost
        );


    if(!options.length)
        return;


    const reverse = {

        left:"right",
        right:"left",
        up:"down",
        down:"up",
        none:"none"

    };


    let choices =
        options.filter(
            direction =>
                direction !==
                reverse[ghost.dir]
        );


    if(!choices.length)
        choices = options;


    let target;


    if(
        Date.now() <
        frightenedUntil
    ){

        target = {

            x:
                Math.random() *
                (COLS-2) + 1,

            y:
                Math.random() *
                (ROWS-2) + 1

        };

    }else{

        const mode =
            (
                Math.floor(
                    Date.now()/4500
                ) +
                ghost.id
            ) % 2;


        if(mode === 0){

            target = {

                x:player.x,

                y:player.y

            };

        }else{

            target = {

                x:ghost.home[0],

                y:ghost.home[1]

            };

        }

    }


    choices.sort(
        (a,b)=>{

            const da =
                distanceAfter(
                    ghost,
                    a,
                    target
                );

            const db =
                distanceAfter(
                    ghost,
                    b,
                    target
                );

            return da-db;

        }
    );


    if(
        Math.random() < 0.18
    ){

        ghost.nextDir =
            choices[
                Math.floor(
                    Math.random() *
                    choices.length
                )
            ];

    }else{

        ghost.nextDir =
            choices[0];

    }

}


function distanceAfter(
    entity,
    direction,
    target
){

    const nx =
        Math.round(entity.x) +
        DIRS[direction].x;

    const ny =
        Math.round(entity.y) +
        DIRS[direction].y;


    return Math.hypot(
        nx-target.x,
        ny-target.y
    );

}


/* =========================================================
   COMER PELLET
========================================================= */

function eatPellet(){

    if(!player)
        return;


    const x =
        Math.round(player.x);

    const y =
        Math.round(player.y);


    const pelletKey =
        gridKey(x,y);


    if(
        !pellets.has(
            pelletKey
        )
    ){

        return;

    }


    pellets.delete(
        pelletKey
    );


    const power =
        (
            x === 1 ||
            x === COLS-2
        ) &&
        (
            y === 1 ||
            y === ROWS-2
        );


    if(power){

        addScore(50);

        frightenedUntil =
            Date.now() + 7000;


        ghosts.forEach(
            ghost=>{

                ghost.speed =
                    0.062 +
                    level * 0.001;

            }
        );


        showToast(
            "⚡ MODO PODER"
        );

    }else{

        addScore(10);

    }


    if(
        pellets.size === 0
    ){

        addScore(1000);

        level++;

        setTimeout(()=>{

            if(running){

                newLevel();

            }

        },500);

    }

}


/* =========================================================
   COLISIONES
========================================================= */

function checkGhostCollisions(){

    for(
        const ghost of ghosts
    ){

        const distance =
            Math.hypot(
                player.x -
                ghost.x,

                player.y -
                ghost.y
            );


        if(distance < 0.62){

            if(
                Date.now() <
                frightenedUntil
            ){

                addScore(200);


                ghost.x =
                    ghost.home[0];

                ghost.y =
                    ghost.home[1];

                ghost.dir =
                    "none";

                ghost.nextDir =
                    "none";


            }else{

                loseLife();

                return;

            }

        }

    }

}


/* =========================================================
   DIRECCIÓN JUGADOR
========================================================= */

function setDirection(
    direction
){

    if(
        !running ||
        !player
    ){

        return;

    }


    player.nextDir =
        direction;

}


/* =========================================================
   MENSAJES
========================================================= */

function showToast(text){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(()=>{

            toast.classList.remove(
                "show"
            );

        },900);

}


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();


    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    W =
        Math.max(
            1,
            rect.width
        );


    H =
        Math.max(
            1,
            rect.height
        );


    canvas.width =
        Math.round(
            W * DPR
        );


    canvas.height =
        Math.round(
            H * DPR
        );


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );


    cell =
        Math.min(
            W / COLS,
            H / ROWS
        );

}


window.addEventListener(
    "resize",
    resizeCanvas
);


window.addEventListener(
    "orientationchange",
    ()=>{
        setTimeout(
            resizeCanvas,
            100
        );
    }
);


/* =========================================================
   DIBUJO
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    const offsetX =
        (W - cell*COLS) / 2;

    const offsetY =
        (H - cell*ROWS) / 2;


    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawBackgroundGrid(
        offsetX,
        offsetY
    );


    drawWalls(
        offsetX,
        offsetY
    );


    drawPellets(
        offsetX,
        offsetY
    );


    if(player){

        drawPlayer(
            offsetX,
            offsetY
        );

    }


    ghosts.forEach(
        (ghost,index)=>{

            drawGhost(
                ghost,
                index,
                offsetX,
                offsetY
            );

        }
    );

}


/* =========================================================
   GRID FONDO
========================================================= */

function drawBackgroundGrid(
    ox,
    oy
){

    ctx.save();

    ctx.globalAlpha =
        0.10;

    ctx.strokeStyle =
        "#06343d";

    ctx.lineWidth = 1;


    for(
        let x=0;
        x<=COLS;
        x++
    ){

        ctx.beginPath();

        ctx.moveTo(
            ox + x*cell,
            oy
        );

        ctx.lineTo(
            ox + x*cell,
            oy + ROWS*cell
        );

        ctx.stroke();

    }


    for(
        let y=0;
        y<=ROWS;
        y++
    ){

        ctx.beginPath();

        ctx.moveTo(
            ox,
            oy + y*cell
        );

        ctx.lineTo(
            ox + COLS*cell,
            oy + y*cell
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   PAREDES
========================================================= */

function drawWalls(
    ox,
    oy
){

    ctx.save();


    ctx.lineWidth =
        Math.max(
            1.5,
            cell * 0.11
        );


    ctx.strokeStyle =
        "#00d9ff";


    ctx.shadowColor =
        "#00d9ff";


    ctx.shadowBlur =
        Math.min(
            14,
            cell * 0.55
        );


    for(
        let y=0;
        y<ROWS;
        y++
    ){

        for(
            let x=0;
            x<COLS;
            x++
        ){

            if(
                maze[y][x] !== 1
            ){

                continue;

            }


            const px =
                ox + x*cell;

            const py =
                oy + y*cell;


            ctx.fillStyle =
                "#041017";


            ctx.fillRect(
                px,
                py,
                cell,
                cell
            );


            ctx.beginPath();


            if(
                !isOpen(x,y-1)
            ){

                ctx.moveTo(
                    px,
                    py
                );

                ctx.lineTo(
                    px+cell,
                    py
                );

            }


            if(
                !isOpen(x+1,y)
            ){

                ctx.moveTo(
                    px+cell,
                    py
                );

                ctx.lineTo(
                    px+cell,
                    py+cell
                );

            }


            if(
                !isOpen(x,y+1)
            ){

                ctx.moveTo(
                    px,
                    py+cell
                );

                ctx.lineTo(
                    px+cell,
                    py+cell
                );

            }


            if(
                !isOpen(x-1,y)
            ){

                ctx.moveTo(
                    px,
                    py
                );

                ctx.lineTo(
                    px,
                    py+cell
                );

            }


            ctx.stroke();

        }

    }


    ctx.restore();

}


/* =========================================================
   PELLETS
========================================================= */

function drawPellets(
    ox,
    oy
){

    const now =
        performance.now();


    for(
        const pelletKey of pellets
    ){

        const parts =
            pelletKey
                .split(",")
                .map(Number);


        const x = parts[0];
        const y = parts[1];


        const px =
            ox + (x+0.5)*cell;

        const py =
            oy + (y+0.5)*cell;


        const power =
            (
                x===1 ||
                x===COLS-2
            ) &&
            (
                y===1 ||
                y===ROWS-2
            );


        const radius =
            power
                ? cell*0.25
                : cell*0.075;


        const pulse =
            power
                ? 1 +
                    0.18 *
                    Math.sin(
                        now*0.008
                    )
                : 1;


        ctx.save();


        ctx.fillStyle =
            power
                ? "#fff"
                : "#a8f7ff";


        ctx.shadowColor =
            "#00e5ff";


        ctx.shadowBlur =
            power ? 16 : 7;


        ctx.beginPath();


        ctx.arc(
            px,
            py,
            radius*pulse,
            0,
            Math.PI*2
        );


        ctx.fill();


        ctx.restore();

    }

}


/* =========================================================
   JUGADOR
========================================================= */

function drawPlayer(
    ox,
    oy
){

    const px =
        ox +
        (player.x+0.5)*cell;

    const py =
        oy +
        (player.y+0.5)*cell;


    let angle = 0;


    if(
        player.dir === "left"
    )
        angle = Math.PI;


    if(
        player.dir === "up"
    )
        angle = -Math.PI/2;


    if(
        player.dir === "down"
    )
        angle = Math.PI/2;


    const mouth =
        0.24 +
        0.12 *
        Math.abs(
            Math.sin(
                player.anim
            )
        );


    const radius =
        cell*0.38;


    ctx.save();


    ctx.translate(
        px,
        py
    );


    ctx.rotate(
        angle
    );


    ctx.fillStyle =
        "#ffe600";


    ctx.shadowColor =
        "#ffe600";


    ctx.shadowBlur =
        15;


    ctx.beginPath();


    ctx.moveTo(
        0,
        0
    );


    ctx.arc(
        0,
        0,
        radius,
        mouth,
        Math.PI*2-mouth
    );


    ctx.closePath();

    ctx.fill();


    ctx.restore();

}


/* =========================================================
   FANTASMAS
========================================================= */

function drawGhost(
    ghost,
    index,
    ox,
    oy
){

    const colors = [

        "#ff3b72",
        "#ff7a00",
        "#39e75f",
        "#b76cff"

    ];


    const frightened =
        Date.now() <
        frightenedUntil;


    const px =
        ox +
        (ghost.x+0.5)*cell;


    const py =
        oy +
        (ghost.y+0.5)*cell;


    const radius =
        cell*0.36;


    const color =
        frightened
            ? "#287dff"
            : colors[
                index %
                colors.length
            ];


    ctx.save();


    ctx.translate(
        px,
        py
    );


    ctx.fillStyle =
        color;


    ctx.shadowColor =
        color;


    ctx.shadowBlur =
        13;


    ctx.beginPath();


    ctx.arc(
        0,
        -radius*0.05,
        radius,
        -Math.PI,
        0
    );


    ctx.lineTo(
        radius,
        radius*0.78
    );


    for(
        let i=0;
        i<3;
        i++
    ){

        ctx.lineTo(
            radius -
            radius*(i+0.5)/3,
            radius*0.55
        );


        ctx.lineTo(
            radius -
            radius*(i+1)/3,
            radius*0.78
        );

    }


    ctx.lineTo(
        -radius,
        radius*0.78
    );


    ctx.closePath();

    ctx.fill();


    ctx.shadowBlur = 0;


    ctx.fillStyle =
        "#fff";


    ctx.beginPath();


    ctx.ellipse(
        -radius*0.34,
        -radius*0.08,
        radius*0.18,
        radius*0.23,
        0,
        0,
        Math.PI*2
    );


    ctx.ellipse(
        radius*0.34,
        -radius*0.08,
        radius*0.18,
        radius*0.23,
        0,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.fillStyle =
        "#101018";


    ctx.beginPath();


    ctx.arc(
        -radius*0.30,
        -radius*0.05,
        radius*0.08,
        0,
        Math.PI*2
    );


    ctx.arc(
        radius*0.30,
        -radius*0.05,
        radius*0.08,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   UPDATE
========================================================= */

function update(
    dt
){

    if(
        !running ||
        paused
    ){

        return;

    }


    moveEntity(
        player,
        dt
    );


    eatPellet();


    for(
        const ghost of ghosts
    ){

        chooseGhostDirection(
            ghost
        );


        moveEntity(
            ghost,
            dt
        );

    }


    checkGhostCollisions();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(
    timestamp
){

    if(!running)
        return;


    const dt =
        Math.min(
            34,
            timestamp -
            lastTime ||
            16.67
        );


    lastTime =
        timestamp;


    update(dt);

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   CONTROLES
========================================================= */

function showControls(){

    running = false;


    overlay.style.display =
        "flex";


    panelLogo.textContent =
        "CONTROLES";


    panelSubtitle.textContent =
        "MUÉVETE POR EL LABERINTO";


    startBtn.textContent =
        "VOLVER A JUGAR";


    help.innerHTML =
        "📱 <b>iPhone:</b> desliza sobre el laberinto.<br><br>" +
        "🖥️ <b>PC:</b> flechas o WASD.<br><br>" +
        "⚡ Las bolas grandes activan el modo poder durante 7 segundos.";

}


/* =========================================================
   BOTÓN JUGAR
========================================================= */

startBtn.addEventListener(
    "click",
    function(){

        startGame();

    }
);


/* =========================================================
   BOTÓN CONTROLES
========================================================= */

controlsBtn.addEventListener(
    "click",
    function(){

        showControls();

    }
);


/* =========================================================
   TECLADO PC
========================================================= */

window.addEventListener(
    "keydown",
    function(event){

        const keyboardDirections = {

            ArrowLeft:"left",
            ArrowRight:"right",
            ArrowUp:"up",
            ArrowDown:"down",

            a:"left",
            d:"right",
            w:"up",
            s:"down",

            A:"left",
            D:"right",
            W:"up",
            S:"down"

        };


        const direction =
            keyboardDirections[
                event.key
            ];


        if(direction){

            event.preventDefault();


            if(!running){

                startGame();

            }


            setDirection(
                direction
            );

        }


        if(
            event.key === "Escape" &&
            running
        ){

            paused =
                !paused;

        }

    }
);


/* =========================================================
   SWIPE IPHONE / POINTER EVENTS
   IMPORTANTE:
   SOLO CANVAS.
   NUNCA CAPTURAMOS TOUCHEND EN DOCUMENT.
========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(event){

        if(!running)
            return;


        swipeStart = {

            x:event.clientX,

            y:event.clientY,

            id:event.pointerId

        };


        try{

            canvas.setPointerCapture(
                event.pointerId
            );

        }catch(error){}

    }
);


canvas.addEventListener(
    "pointerup",
    function(event){

        if(
            !swipeStart ||
            event.pointerId !==
            swipeStart.id
        ){

            return;

        }


        const dx =
            event.clientX -
            swipeStart.x;


        const dy =
            event.clientY -
            swipeStart.y;


        swipeStart = null;


        const distance =
            Math.max(
                Math.abs(dx),
                Math.abs(dy)
            );


        if(distance < 18)
            return;


        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            setDirection(
                dx > 0
                    ? "right"
                    : "left"
            );

        }else{

            setDirection(
                dy > 0
                    ? "down"
                    : "up"
            );

        }

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        swipeStart = null;

    }
);


/* =========================================================
   INICIALIZACIÓN
========================================================= */

resizeCanvas();

generateMaze();

placePellets();

resetPositions();

updateHUD();

draw();


})();
</script>
